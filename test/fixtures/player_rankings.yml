# PlayerRanking-Fixtures (Ranglisten-Eintraege je Spieler/Disziplin/Region/Saison)
#
# Ohne diese Datei skippten alle region-scoped Player-Suchen der MCP-Tools: sie
# holen ihr Sample per `Player.joins(:player_rankings).where(player_rankings:
# {region_id: nbv.id})` bzw. pruefen Disziplin-Erfahrung ueber PlayerRanking.
#
# PlayerRanking hat vier PFLICHT-belongs_to (player, region, season, discipline) —
# alle vier FKs muessen auf existierende Fixtures zeigen, sonst schlaegt schon das
# Laden fehl. FKs explizit statt Label-Verweise (siehe Kommentar in tournaments.yml).
#
# Disziplinen: Dreiband (50_000_001) fuer die Namens-Suchen, "Freie Partie klein"
# (50_000_004) zusaetzlich fuer ListPlayersByClubAndDiscipline, das genau diese
# Disziplin sucht.

