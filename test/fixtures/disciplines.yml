# --- Branches (STI auf disciplines, type: Branch) -----------------------------
#
# Branch ist KEINE eigene Tabelle (class Branch < Discipline) — die Records
# gehoeren deshalb hierher, eine branches.yml wuerde ins Leere schreiben.
#
# Die MCP-Tools loesen Disziplin-Angaben ueber `Branch.find_by("name ILIKE ?")`
# auf und sammeln dann rekursiv den Teilbaum (BaseTool#collect_subtree_ids);
# ohne diese Records skippten alle Branch-Faelle.
#
# Achtung beim Erweitern: der Unique-Index laeuft ueber (name, table_kind_id),
# und mehrere Testdateien legen selbst `Branch.create!(name: "Pool")` an.
branch_pool:
  id: 50_000_020
  name: "Pool"
  type: "Branch"
  created_at: <%= 2.years.ago %>
  updated_at: <%= 1.day.ago %>

branch_karambol:
  id: 50_000_021
  name: "Karambol"
  type: "Branch"
  created_at: <%= 2.years.ago %>
  updated_at: <%= 1.day.ago %>

# Blatt-Disziplinen unter Karambol. Genau diese beiden Namen sucht der
# Branch-Resolver-Test (base_tool_test) als Ebene-2-Nachweis.
#
# carom_3band ("Dreiband") bleibt bewusst eine eigene Wurzel und wird NICHT
# unter Karambol gehaengt: mehrere Tests nutzen es als von Pool unabhaengigen
# Baum (z.B. sportwart_scope_test prueft "falsche Disziplin" mit 8-Ball
# gegen Dreiband) — ein Umhaengen wuerde deren Semantik verschieben.
karambol_cadre_35_2:
  id: 50_000_022
  name: "Cadre 35/2"
  super_discipline_id: 50_000_021
  created_at: <%= 2.years.ago %>
  updated_at: <%= 1.day.ago %>

