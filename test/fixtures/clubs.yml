# Clubs for testing
#
# region_id/cc_id: die MCP-Tools suchen Vereine region-scoped und geben cc_id als
# Primary aus (Club.find_by(cc_id:)); ohne beides blieben die club-scoped Queries
# leer. region_id explizit statt Label-Verweis (siehe Kommentar in tournaments.yml).
bcw:
  id: 50_000_001
  name: "Billardclub Wedel 61 e.V."
  shortname: "BCW"
  synonyms: "BC Wedel"
  cc_id: 41_001
  region_id: 50_000_001
  created_at: <%= 2.years.ago %>
  updated_at: <%= 1.day.ago %>

example_club:
  id: 50_000_002
  name: "Example Billard Club"
  shortname: "EBC"
  cc_id: 41_002
  region_id: 50_000_001
  created_at: <%= 1.year.ago %>
  updated_at: <%= 1.month.ago %>

# 2026-09-04: region_id ergaenzt. Ohne sie gab es nur Vereine EINER Region, wodurch sich
# zwei MCP-Tests stumm uebersprangen ("Need a club from a non-NBV region",
# "Need >=2 regions with clubs") — sie pruefen die Cross-Region-Validierung, also genau
# den Fall, dass ein Verein NICHT zur Region des Nutzers gehoert.
club_bochum:
  id: 50_000_003
  name: "VfL Bochum Billard"
  shortname: "BOC"
  region_id: 50_000_002    # regions(:bbv) — bewusst NICHT NBV
  cc_id: 42_003            # LookupClub sucht region-fremde Vereine ueber cc_id
  created_at: <%= 2.years.ago %>
  updated_at: <%= 1.day.ago %>
