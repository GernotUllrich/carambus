async function startTournament() {
  const need = state.planMeta?.players;
  if (!state.executorParams || state.participants.length !== need) { alert(`Genau ${need} Teilnehmer + Plan nötig.`); return; }
  if (!state.tables.length) { alert("Mindestens einen Tisch."); return; }
  if (isLive()) {
    try {
      const loc = state.location; if (!loc || (loc.id == null && loc.cc_id == null)) { alert("Live: Location laden."); return; }
      const t = await createTournament({ externalId: tournamentExternalId(), title: `${state.planName} ${state.discipline}`, location: loc, discipline: state.discipline });
      state.carambusTournament = { id: t.id ?? null, external_id: t.external_id || tournamentExternalId() };
      const fails = [];
      for (const name of state.tables) { try { await lockTable({ ...tournamentApiRef(), tableName: name, tableId: tableIdOf(name) }); } catch (e) { fails.push(`${name}: ${errMsg(e)}`); } }
      if (fails.length && !confirm("Tische teils nicht gebunden:\n" + fails.join("\n") + "\n\nFortfahren?")) return;
    } catch (e) { alert("Turnier anlegen: " + errMsg(e)); return; }
  }
  state.records = []; state.gameUI = {}; state.tableLot = {}; state.phase = "running";
  save(); run = rebuildRun(); renderAll(); switchTab("games");
}
// Attach-Modus (Multi-Laptop, Multi-Tag): Turnier wurde im Carambus-Web angelegt
// (mit tournament_plan). Die App attached sich per Deeplink `?cb_tournament_id=<PK>` an
// dieses existierende Turnier — statt eines eigenen. Kernidee:
//   • Alle Live-API-Aufrufe verwenden tournament_id (globaler PK), NICHT external_id
//     (das Turnier hat keinen — Web-erzeugt).
//   • gameExternalId(key) = `attach-<PK>-<escapedKey>` — deterministisch aus PK, sodass
//     alle bedienden Laptops zu denselben start_game-IDs kommen (Idempotenz garantiert).
//   • State-Restore: seeding liefert Plan+Teams+Format+Location; round_result(1..N)
//     liefert bereits gespielte Games → rekonstruiert state.records.
// Voraussetzung Server: Paul-Patch scenario/api/seeding-tournament-plan (deployt bcw
// 2026-08-18) — seeding.tournament.tournament_plan.{name,executor_params}.
async function attachToTournament(tournamentId) {
  if (!isLive()) { alert("Attach braucht Live-Verbindung (Verbindungs-Modal oben rechts)."); return; }
  const region = Carambus.regionShortname();
  let seeding;
  try { seeding = await Carambus.api.fetchSeeding({ tournamentId, region }); }
  catch (e) { alert("Turnier laden: " + errMsg(e)); return; }
  const tp = seeding?.tournament?.tournament_plan;
  if (!tp || !tp.executor_params) {
    alert("Turnier hat keinen tournament_plan im Server-Payload — Attach nicht möglich.\n(Prüfe im Carambus-Web ob dem Turnier ein Plan zugeordnet ist.)");
    return;
  }
  let parsedPlan;
  try { parsedPlan = parsePlan(tp.executor_params); }
  catch (e) { alert("Plan nicht parsebar: " + e.message); return; }
  const planMeta = derivePlanMeta(parsedPlan);
  // Teilnehmer aus seeding.teams (Setzplatz-Reihenfolge). Für Single-Turniere = 1 Player/Team.
  const participants = [];
  for (const team of (seeding.teams || [])) {
    for (const p of (team.players || [])) participants.push({ ...p, seed: participants.length + 1 });
  }
  if (planMeta.players && participants.length !== planMeta.players) {
    if (!confirm(`Plan erwartet ${planMeta.players} Spieler, seeding liefert ${participants.length}. Trotzdem attachen?`)) return;
  }
  const fmt = seeding.tournament.format || {};
  const format = { balls_goal: fmt.target_points ?? 30, innings_goal: fmt.max_innings ?? 20 };
  const location = seeding.tournament.location || {};
  let availableTables = [], tables = [];
  try {
    if (location.id != null || location.cc_id != null) {
      const tblDoc = await Carambus.api.fetchTables({ id: location.id, cc_id: location.cc_id }, region);
      availableTables = tblDoc.tables || [];
      tables = availableTables.slice(0, planMeta.tables).map(t => t.name);
    }
  } catch (e) { console.warn("Tische laden:", e); }
  // Runden aus Plan (max round-no über group-games); Fallback 5 (T08).
  const maxRounds = parsedPlan.games.reduce((m, g) => Math.max(m, g.round || 0), 0) || 5;
  const tournamentCcId = seeding.tournament.cc_id;
  const records = [], gameUI = {};
  // tournament_cc_id kann null sein (Turnier lokal per Console angelegt, kein TournamentCc
  // verknüpft). Dann kann round_result nicht abgefragt werden — für den Erst-Attach ohnehin
  // irrelevant (leere Ergebnisliste). Später (falls TournamentCc nachgezogen wird) klappt es.
  try {
    if (tournamentCcId == null) throw new Error("skip: kein tournament_cc_id");
    const results = await Carambus.api.fetchAllRoundResults({ tournamentCcId, maxRounds, region });
    const prefix = `attach-${tournamentId}-`;
    const keyByExtId = {};
    for (const g of parsedPlan.games) keyByExtId[prefix + g.key.replace(/[^a-z0-9]+/gi, "_")] = g.key;
    for (const res of results) {
      const key = keyByExtId[res.external_id];
      if (!key) continue; // fremdes external_id, ignorieren
      const gps = res.participants || [];
      const gpA = gps.find(x => x.role === "playera"), gpB = gps.find(x => x.role === "playerb");
      const resObj = {
        a: { balls: gpA?.points ?? null, innings: gpA?.innings ?? null, hs: gpA?.high_series ?? null },
        b: { balls: gpB?.points ?? null, innings: gpB?.innings ?? null, hs: gpB?.high_series ?? null }
      };
      if (res.ended_at) {
        let winner = null;
        if (resObj.a.balls != null && resObj.b.balls != null) {
          if (resObj.a.balls > resObj.b.balls) winner = "a";
          else if (resObj.b.balls > resObj.a.balls) winner = "b";
        }
        records.push({ key, res: resObj, winner, at: Date.parse(res.ended_at) || Date.now(), table: res.table_name || null });
      } else if (res.started_at) {
        gameUI[key] = { table: res.table_name || null, external_id: res.external_id };
      }
    }
  } catch (e) { console.warn("Round-Ergebnisse laden:", e); }
  // State übernehmen
  state.discipline = seeding.tournament.discipline?.name || state.discipline;
  state.planName = tp.name || state.planName;
  state.executorParams = tp.executor_params;
  state.planMeta = { players: planMeta.players, ngroups: planMeta.ngroups, tables: planMeta.tables };
  state.format = format;
  state.participants = participants;
  if (location.id != null || location.cc_id != null) state.location = location;
  state.availableTables = availableTables;
  state.tables = tables;
  state.records = records;
  state.gameUI = gameUI;
  state.tableLot = {};
  state.carambusTournament = {
    id: tournamentId, external_id: null, attach: true,
    cc_id: tournamentCcId, title: seeding.tournament.name || null
  };
  // Tische an den TournamentMonitor binden — start_game verlangt das (StartGameProcessor
  // wirft sonst TableNotBoundError). Im Setup-Flow macht das startTournament; im
  // Attach-Flow muss es hier passieren. Fehlschläge sind nicht fatal (Tisch evtl. von
  // einem anderen Turnier belegt) — der TL sieht die Liste und entscheidet.
  const lockFails = [];
  for (const name of state.tables) {
    try { await lockTable({ ...tournamentApiRef(), tableName: name, tableId: tableIdOf(name) }); }
    catch (e) { lockFails.push(`${name}: ${errMsg(e)}`); }
  }
  if (lockFails.length) alert("Tische teils nicht gebunden:\n" + lockFails.join("\n") + "\n\nDiese Tische können erst nach Freigabe bespielt werden.");
  state.phase = "running";
  save(); run = rebuildRun(); renderAll(); switchTab("games");
}
// Bindet die konfigurierten Tische (erneut) an den TournamentMonitor. Noetig nach dem
// Einspielen einer Sicherung: Die Sicherung stellt den App-Zustand her, die Bindung lebt
// aber auf dem Server und fehlt dann — start_game quittiert das mit 422
// "Table not bound to this tournament". Fasst state.records NICHT an, im Gegensatz zum
// Attach-Flow.
async function rebindTables() {
  if (!isLive()) { alert("Keine Carambus-Verbindung — oben rechts anmelden."); return; }
  if (!state.carambusTournament?.id) { alert("Nicht an ein Carambus-Turnier attached."); return; }
  const names = state.tables || [];
  if (!names.length) { alert("Keine Tische konfiguriert."); return; }
  const fails = [];
  for (const name of names) {
    try { await lockTable({ ...tournamentApiRef(), tableName: name, tableId: tableIdOf(name) }); }
    catch (e) { fails.push(`${name}: ${errMsg(e)}`); }
  }
  if (fails.length) {
    alert(`${names.length - fails.length} von ${names.length} Tischen gebunden.\n\nNicht gebunden:\n${fails.join("\n")}\n\nMeist haengt so ein Tisch noch an einem anderen Turnier oder es laeuft ein Spiel darauf.`);
  } else {
    alert(`${names.length} Tische gebunden — die Spiele lassen sich jetzt starten.`);
  }
}

// Aus geparsed executor_params: players (Summe g.pl), ngroups, tables (max t<N>).
function derivePlanMeta(parsedPlan) {
  let players = 0;
  for (const g of parsedPlan.groups) players += (g.pl || 0);
  if (!players && Array.isArray(parsedPlan.rk)) players = parsedPlan.rk.length;
  let maxTable = 0;
  for (const g of parsedPlan.games) {
    if (typeof g.table !== "string") continue;
    const m = /^t(\d+)$/.exec(g.table);
    if (m) maxTable = Math.max(maxTable, parseInt(m[1], 10));
  }
  return { players, ngroups: parsedPlan.groups.length || 1, tables: maxTable || 1 };
}

async function resetTournament() {
  const live = isLive();
  const attach = !!(state.carambusTournament && state.carambusTournament.attach);
  // Attach-Modus: das Turnier existiert im Carambus-Web (nicht app-generiert). Cleanup würde
  // das Web-Turnier zerstören → NICHT machen. Nur App-lokal zurück zum Setup; ein zweiter
  // Attach an dasselbe cb_tournament_id lädt den Server-Stand erneut.
  const msg = attach
    ? "App-Verbindung zum Turnier lösen? Ergebnisse bleiben im Carambus erhalten (nur lokale Anzeige wird geleert)."
    : ("Turnier verwerfen? Ergebnisse gehen verloren (Setup bleibt)." + (live ? "\nLive: Turnier + Spiele werden in Carambus abgeräumt (Tische frei)." : ""));
  if (!confirm(msg)) return;
  if (live && !attach) {
    // Abbruch räumt das Carambus-Turnier ab (Tische frei + Turnier/Spiele löschen).
    try {
      const body = await endTournament({ ...tournamentApiRef(), cleanup: true });
      if (!body.tournament_deleted) console.warn("Abbruch: Carambus hat das Turnier nicht gelöscht", body);
    } catch (e) {
      if (!confirm("Carambus-Abräumen fehlgeschlagen: " + errMsg(e) + "\n\nTrotzdem lokal verwerfen?")) return;
    }
  }
  state.records = []; state.gameUI = {}; state.tableLot = {}; state.phase = "setup"; state.carambusTournament = null; save(); run = rebuildRun(); renderAll(); switchTab("setup");
}

// ===== SPIELE & GRUPPEN =====
// Carambus-Table-id zum Tischnamen (aus den geladenen Tischen) → bevorzugt an lock_table/
// start_game (robust gegen doppelte Tischnamen einer Location); sonst Fallback auf den Namen.
function tableIdOf(name) { const t = (state.availableTables || []).find(x => x.name === name); return t && t.id != null ? t.id : null; }
function freeTableList() { const busy = new Set(Object.values(state.gameUI).filter(u => u.table).map(u => u.table)); return state.tables.filter(n => !busy.has(n)).sort((a, b) => (tableNo(a) ?? 0) - (tableNo(b) ?? 0)); }
function tablesSorted() { return state.tables.slice().sort((a, b) => (tableNo(a) ?? 0) - (tableNo(b) ?? 0)); }
function logicalToPhysical(label) { const m = /^t(\d+)$/.exec(String(label || "")); return m ? (tablesSorted()[(+m[1]) - 1] || null) : null; }
// eae_pg-Choreografie: logischer Tisch tN → fester physischer Tisch. So „bleibt" der
// Sieger an seinem Tisch (R2 trägt denselben logischen Tisch wie R1).
function groupTables(n) { return run.plan.games.filter(x => x.kind === "group" && x.group === n && x.round === 1).map(x => logicalToPhysical(x.table)).filter(Boolean); }
// R3-Tische werden ausgelost: einmal die Gruppentische mischen, Ergebnis je R3-Spiel in
// state.tableLot persistieren (stabil über Rebuild/Render; neu nur bei Reset/Neustart).
function r3LotTable(g) {
  if (!state.tableLot) state.tableLot = {};
  if (state.tableLot[g.key]) return state.tableLot[g.key];
  const tables = shuffle(groupTables(g.lot).slice());
  run.plan.games.filter(x => x.lot === g.lot && x.round === 3).forEach((x, i) => { if (tables[i]) state.tableLot[x.key] = tables[i]; });
  save();
  return state.tableLot[g.key] || null;
}
function preferredTable(g, freeSet) {
  if (!g || !g.choreo) return null;
  const t = (g.lot != null) ? r3LotTable(g) : logicalToPhysical(g.table); // R3: Los · R1/R2: fester Tisch
  return (t && (!freeSet || freeSet.has(t))) ? t : null;
}
function gameStatus(key) { if (run.results[key]) return "done"; if (state.gameUI[key]?.table) return "running"; return null; }

function renderGames() {
  const el = document.getElementById("tab-games");
  if (!run) { el.innerHTML = `<div class="card"><p class="muted">Noch kein Turnier — erst im Setup erzeugen.</p></div>`; return; }
  const ready = runReadyGames(run).filter(g => !state.gameUI[g.key]?.table);
  const running = runReadyGames(run).filter(g => state.gameUI[g.key]?.table).concat(
    run.plan.games.filter(g => state.gameUI[g.key]?.table && !run.results[g.key]).map(g => ({ ...g, playerA: resolveSlot(run, g.a), playerB: resolveSlot(run, g.b) }))
  );
  const runningUniq = [...new Map(running.map(g => [g.key, g])).values()];
  const free = freeTableList();
  const done = Object.keys(run.results).length;
  const doneGames = run.plan.games.filter(g => run.results[g.key]).map(g => ({ ...g, playerA: resolveSlot(run, g.a), playerB: resolveSlot(run, g.b) }));

  el.innerHTML = `
    <div class="card">
      <h2>Tische</h2>
      <div class="tables-bar">${state.tables.map(name => { const u = Object.entries(state.gameUI).find(([k, v]) => v.table === name && !run.results[k]); const g = u ? run.plan.games.find(x => x.key === u[0]) : null; const who = g ? `${shortName(resolveSlot(run, g.a))} vs ${shortName(resolveSlot(run, g.b))}` : "frei"; return `<div class="table-chip ${g ? "busy" : "free"}"><div class="tname">${escapeHtml(name)}</div><div class="who">${escapeHtml(who)}</div></div>`; }).join("")}</div>
      <div class="toolbar">
        <button class="btn" id="btnFill" ${ready.length && free.length ? "" : "disabled"}>▶ Freie Tische belegen</button>
        ${isLive() && runningUniq.length ? `<button class="btn secondary" id="btnPollAll">📥 Ergebnisse holen</button>` : ``}
        <span class="muted">${done}/${run.plan.games.length} Spiele · ${ready.length} bereit · ${runningUniq.length} laufend</span>
      </div>

    </div>

    <div class="card"><h2>Laufend (${runningUniq.length})</h2>${runningUniq.length ? `<div class="matches-grid">${runningUniq.map(g => matchCard(g, "running", free)).join("")}</div>` : `<p class="muted">Kein laufendes Spiel.</p>`}</div>
    ${doneGames.length ? `<div class="card"><h2>Erledigt (${doneGames.length})</h2><div class="matches-grid">${doneGames.map(g => matchCard(g, "done", free)).join("")}</div></div>` : ``}

// Ausstoss-Tausch: Wer den Ausstoss gewinnt, bestimmt den Anstoss — und Carambus
// stellt den Anstoss-Spieler zwingend als "playera" nach links (switch_players
// vertauscht dabei die game_participation.role IN DER DB). Das Ergebnis kommt
// danach positionsbasiert zurueck (Ergebnis1 = playera), ohne Spieler-Identitaet.
// Deshalb pflegen wir die Scoreboard-Reihenfolge hier von Hand nach.
// Siehe HANDOFF-to-carambus-scoreboard-texte-und-monitor-state.md, Befund 4.
function isSwapped(key) { return !!state.gameUI[key]?.swapped; }
function applySwap(key, res) { return (res && isSwapped(key)) ? { a: res.b, b: res.a } : res; }
function toggleSwap(key) {
  const ui = state.gameUI[key];
  if (ui) ui.swapped = !ui.swapped;
  // Bereits uebernommenes Ergebnis mitdrehen (Korrektur, wenn der Tausch beim
  // Import vergessen wurde). WICHTIG: state.records ist die persistierte Quelle,
  // run wird daraus per rebuildRun() abgeleitet — eine Aenderung an run.results
  // allein waere nach dem naechsten Reload wieder weg.
  const rec = (state.records || []).find(r => r.key === key);
  if (rec && rec.res) {
    rec.res = { a: rec.res.b, b: rec.res.a };
    const d = decideGame(rec.res, state.format.balls_goal, state.format.balls_goal);
    rec.winner = d.winner || (rec.winner === "a" ? "b" : (rec.winner === "b" ? "a" : null));
    run = rebuildRun();
  }
  save(); renderAll();
}

function matchCard(g, mode, free) {
  const a = g.playerA ?? resolveSlot(run, g.a), b = g.playerB ?? resolveSlot(run, g.b);
  const res = run.results[g.key]?.res; const winner = run.results[g.key]?.winner;
  const slot = (p, side) => { let cls = "pn"; if (winner) cls += (winner === side ? " win" : " lose"); const sc = res ? `${res[side]?.balls ?? "-"}${res[side]?.innings ? " / " + res[side].innings : ""}` : ""; return `<div class="m-slot"><span class="${cls}">${nameHtml(p)}</span><span class="sc">${escapeHtml(sc)}</span></div>`; };
  const swapped = mode === "running" && isSwapped(g.key);
  const slots = swapped ? `${slot(b, "b")}${slot(a, "a")}` : `${slot(a, "a")}${slot(b, "b")}`;
  let actions = "";
  if (mode === "ready") { const pref = preferredTable(g, new Set(free)); actions = free.length ? `<select class="m-table" data-id="${g.key}">${free.map(t => `<option value="${escapeHtml(t)}"${t === pref ? " selected" : ""}>${escapeHtml(t)}</option>`).join("")}</select><button class="btn m-start" data-id="${g.key}">▶ Starten</button>` : `<span class="muted">kein freier Tisch</span>`; }
  else if (mode === "done") actions = `<button class="btn secondary m-swap" data-id="${g.key}" title="Ergebnis seitenverkehrt uebernommen? Hier drehen">⇄ Ergebnis drehen</button>`;
  else if (mode === "running") actions = `<button class="btn ${swapped ? "" : "secondary"} m-swap" data-id="${g.key}" title="Reihenfolge an das Scoreboard angleichen — oben steht, wer angestossen hat">⇄ ${swapped ? "getauscht" : "Spieler tauschen"}</button>${isLive() ? `<button class="btn m-poll" data-id="${g.key}">📥 Ergebnis holen</button>` : ``}<button class="btn secondary m-manual" data-id="${g.key}">✎ Ergebnis erfassen</button>`;
  const hint = swapped ? `<div class="muted" style="font-size:.85em;padding:2px 0 0 2px;">Reihenfolge wie auf dem Scoreboard</div>` : ``;
  return `<div class="m-card ${mode}"><div class="m-top"><span>${escapeHtml(gameLabel(g))}</span><span class="m-id">${escapeHtml(g.key)}${state.gameUI[g.key]?.table ? " · " + escapeHtml(state.gameUI[g.key].table) : ""}</span></div>${slots}${hint}<div class="m-actions">${actions}</div><div id="manual-${cssId(g.key)}"></div></div>`;
}
function gameLabel(g) { if (g.kind === "group") return `Gruppe ${g.group}${g.round ? " · R" + g.round : ""}`; const names = { fin: "Finale", hf1: "Halbfinale 1", hf2: "Halbfinale 2", hf: "Halbfinale", qf: "Viertelfinale" }; return names[g.key] || (g.key.startsWith("p<") ? "Platz " + g.key.slice(2, -1) : g.key); }
function cssId(key) { return key.replace(/[^a-z0-9]+/gi, "_"); }

function groupCard(n) {
  const st = runGroupStandings(run, n);
  const complete = groupComplete(run, n);
  const rows = st.map((s, i) => `<tr class="${complete && i < 2 ? "q" : ""}"><td class="rk">${i + 1}</td><td style="text-align:left">${nameHtml(s.player)}</td><td>${s.points}</td><td style="font-family:monospace">${s.gd.toFixed(2)}</td></tr>`).join("");
  return `<div><h3 style="color:var(--accent);">Gruppe ${n} ${complete ? '<span class="badge done">fertig</span>' : '<span class="badge open">läuft</span>'}</h3>
    <table class="standings-table"><thead><tr><th>#</th><th style="text-align:left">Spieler</th><th>Pkt</th><th>GD</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderPlacementList() {
  const pg = run.plan.games.filter(g => g.kind === "placement");
  if (!pg.length) return `<p class="muted">Keine Platzierungsspiele.</p>`;
  return `<div class="matches-grid">` + pg.map(g => {
    const a = resolveSlot(run, g.a), b = resolveSlot(run, g.b), st = gameStatus(g.key);
    const res = run.results[g.key]?.res, winner = run.results[g.key]?.winner;
    const slot = (p, ref, side) => { let cls = "pn"; if (!p) cls += " pending"; if (winner) cls += (winner === side ? " win" : " lose"); const sc = res ? `${res[side]?.balls ?? "-"}` : ""; return `<div class="m-slot"><span class="${cls}">${p ? nameHtml(p) : escapeHtml(ref)}</span><span class="sc">${escapeHtml(sc)}</span></div>`; };
    return `<div class="m-card ${st || ""}"><div class="m-top"><span>${escapeHtml(gameLabel(g))}</span><span class="badge ${st === "done" ? "done" : st === "running" ? "running" : ""}">${st === "done" ? "fertig" : st === "running" ? "läuft" : (a && b ? "bereit" : "wartet")}</span></div>${slot(a, g.a, "a")}${slot(b, g.b, "b")}</div>`;
  }).join("") + `</div>`;
}

function bindGameActions(el) {
  el.querySelector("#btnFill")?.addEventListener("click", fillFreeTables);
  el.querySelector("#btnPollAll")?.addEventListener("click", pollAll);
  el.querySelectorAll(".m-start").forEach(b => b.addEventListener("click", () => { const id = b.dataset.id; const sel = el.querySelector(`.m-table[data-id="${cssEsc(id)}"]`); startGameOnTable(id, sel?.value); }));
  el.querySelectorAll(".m-poll").forEach(b => b.addEventListener("click", () => pollGame(b.dataset.id)));
  el.querySelectorAll(".m-manual").forEach(b => b.addEventListener("click", () => openManual(b.dataset.id)));
  el.querySelectorAll(".m-swap").forEach(b => b.addEventListener("click", () => toggleSwap(b.dataset.id)));
}
function cssEsc(s) { return s.replace(/["\\]/g, "\\$&"); }

async function startGameOnTable(key, table) {
  if (!table) { alert("Kein Tisch frei."); return; }
  const g = run.plan.games.find(x => x.key === key); const a = resolveSlot(run, g.a), b = resolveSlot(run, g.b);
  if (!a || !b) { alert("Spiel nicht spielbereit."); return; }
  const ext = gameExternalId(key);
  if (isLive()) {
    try {
      // Scoreboard-Typ aus table_kind der gewählten Disziplin ableiten (Pool/Snooker/Karambol).
      const disc = state.disciplinesDoc?.disciplines?.find(d => d.name === state.discipline);
      const ff = Carambus.util.freeGameForm({ tableKind: disc?.table_kind, discipline: state.discipline });
      await startGame({
        ...tournamentApiRef(), gameExternalId: ext, tableName: table, tableId: tableIdOf(table),
        participants: [{ role: "playera", player: cleanPlayerRef(a), discipline: state.discipline, balls_goal: state.format.balls_goal },
                       { role: "playerb", player: cleanPlayerRef(b), discipline: state.discipline, balls_goal: state.format.balls_goal }],
        format: { innings_goal: state.format.innings_goal, free_game_form: ff, sets_to_play: 1, sets_to_win: 1, allow_follow_up: g.kind === "group" }
      });
    } catch (e) { alert("Spiel starten: " + errMsg(e)); return; }
  }
  state.gameUI[key] = { table, external_id: ext, swapped: false }; save(); renderGames();
}
async function fillFreeTables() {
  // 1. Choreografie-Tische bevorzugt (eae_pg: Sieger bleibt am Tisch / Gruppentische)
  for (const g of runReadyGames(run).filter(x => !state.gameUI[x.key]?.table)) {
    const pref = preferredTable(g, new Set(freeTableList()));
    if (pref) await startGameOnTable(g.key, pref);
  }
  // 2. Restliche bereit-Spiele auf beliebige freie Tische
  let free = freeTableList();
  for (const g of runReadyGames(run).filter(x => !state.gameUI[x.key]?.table)) { if (!free.length) break; await startGameOnTable(g.key, free.shift()); free = freeTableList(); }
}
async function pollGame(key) {
  try { const { status, body } = await acknowledgeResult({ ...tournamentApiRef(), gameExternalId: state.gameUI[key].external_id }); if (status === 409) { alert("Ergebnis noch nicht erfasst."); return; } completeGame(key, mapAckResult(body, key).res); }
  catch (e) { if (e instanceof CarambusError && e.status === 409) { alert("Ergebnis noch nicht erfasst."); return; } alert("Ergebnis holen: " + errMsg(e)); }
}
async function pollAll() { for (const key of Object.keys(state.gameUI)) { if (run.results[key]) continue; try { const { status, body } = await acknowledgeResult({ ...tournamentApiRef(), gameExternalId: state.gameUI[key].external_id }); if (status === 409) continue; completeGame(key, mapAckResult(body, key).res); } catch (_) {} } renderGames(); }
function mapAck(result) { if (!result) return null; const num = v => v == null ? null : (typeof v === "number" ? v : parseInt(v, 10)); return { a: { balls: num(result.Ergebnis1), innings: num(result.Aufnahmen1), hs: num(result["Höchstserie1"] ?? result.Hoechstserie1) }, b: { balls: num(result.Ergebnis2), innings: num(result.Aufnahmen2), hs: num(result["Höchstserie2"] ?? result.Hoechstserie2) } }; }

// ===== Ergebnis-Zuordnung ueber Spieler-Identitaet ========================
// Carambus liefert seit dem Fix zu Befund 4 zusaetzlich `participants` mit voller
// Spieler-Projektion. Damit ordnen wir das Ergebnis der Person zu statt der Position
// (Ergebnis1/2 = Rolle am Tisch, die switch_players beim Ausstoss vertauscht).
// Faellt der Block, greift der alte positionsbasierte Weg samt Tausch-Schalter.
// Siehe HANDOFF-from-carambus-scoreboard-texte-und-monitor-state.md, Befund 4.
const normName = s => String(s ?? "").trim().toLowerCase();
function samePlayer(planP, apiP) {
  if (!planP || !apiP) return false;
  if (planP.cc_id != null && apiP.cc_id != null) return String(planP.cc_id) === String(apiP.cc_id);
  if (planP.dbu_nr != null && apiP.dbu_nr != null) return String(planP.dbu_nr) === String(apiP.dbu_nr);
  // Ohne ID bleibt der Name — bei internationalen Feldern der Regelfall
  // (in Turnier 50000057 hatte 1 von 6 Spielerinnen ueberhaupt eine ba_id).
  return normName(planP.lastname) === normName(apiP.lastname) &&
         normName(planP.firstname) === normName(apiP.firstname);
}
function sideFromParticipant(p) {
  const num = v => v == null ? null : (typeof v === "number" ? v : parseInt(v, 10));
  return { balls: num(p.points), innings: num(p.innings), hs: num(p.high_series) };
}
// Liefert {res, byIdentity}. byIdentity=true -> der Tausch-Schalter wird NICHT angewandt,
// die Zuordnung ist dann bereits personenscharf.
function mapAckResult(body, key) {
  const fallback = () => ({ res: applySwap(key, mapAck(body && body.result)), byIdentity: false });
  const parts = (body && (body.participants || (body.result && body.result.participants))) || null;
  if (!Array.isArray(parts) || parts.length < 2) return fallback();
  const g = run.plan.games.find(x => x.key === key);
  if (!g) return fallback();
  const a = resolveSlot(run, g.a), b = resolveSlot(run, g.b);
  const pa = parts.find(p => samePlayer(a, p.player)), pb = parts.find(p => samePlayer(b, p.player));
  if (!pa || !pb || pa === pb) {
    console.warn("[mapAckResult] participants vorhanden, aber nicht eindeutig zuordenbar — Fallback auf Position", { key });
    return fallback();
  }
  return { res: { a: sideFromParticipant(pa), b: sideFromParticipant(pb) }, byIdentity: true };
}

function completeGame(key, res) {
  const g = run.plan.games.find(x => x.key === key);
  let winner = decideGame(res, state.format.balls_goal, state.format.balls_goal).winner;
  if (!winner) {
    // Gruppenspiel: Remis ok (1:1). Finalrunde sowie eae_pg-R1 (g.decide): Sieger
    // nötig → bei Remis Losen (Tischfolge). Die Punkte bleiben 1:1, der Los-Sieger
    // zählt nur für die Tisch-Choreografie (rk1/rk2 der Folgerunden).
    if (g.kind !== "group" || g.decide) {
      const a = resolveSlot(run, g.a), b = resolveSlot(run, g.b);
      const pick = prompt(`Unentschieden — ${g.decide ? "Losen (Tischwahl)" : "Tie-Break (Finalrunde)"}: Sieger "a"=${shortName(a)} / "b"=${shortName(b)} — leer = Zufalls-Los`);
      winner = (pick === "a" || pick === "b") ? pick : (Math.random() < 0.5 ? "a" : "b");
    }
  }
  state.records.push({ key, res, winner, at: Date.now(), table: state.gameUI[key]?.table ?? null });
  delete state.gameUI[key];
  run = rebuildRun();
  if (runFinished(run)) state.phase = "finished";
  save(); renderAll();
  // Nach JEDEM Ergebnis ins Archiv schieben, nicht erst am Schluss: Der Push ist
  // idempotent, und ein Geraeteverlust mittendrin (iOS raeumt localStorage ohne
  // Vorwarnung) kostet dann nichts. Laeuft absichtlich ohne await — der naechste
  // Anstoss soll nicht auf den Server warten.
  if (isLive()) pushArchive({ silent: true });
}
function openManual(key) {
  const box = document.getElementById("manual-" + cssId(key)); if (!box) return;
  if (box.dataset.open === "1") { box.innerHTML = ""; box.dataset.open = "0"; return; }
  box.dataset.open = "1"; const g = run.plan.games.find(x => x.key === key); const a = resolveSlot(run, g.a), b = resolveSlot(run, g.b);
  const cid = cssId(key);
  box.innerHTML = `<div class="res-inputs"><span class="lbl">Spieler</span><span class="lbl">Bälle</span><span class="lbl">Aufn.</span><span class="lbl">HS</span></div>
    <div class="res-inputs"><span>${nameHtml(a, { short: true })}</span><input type="number" id="ra-b-${cid}"><input type="number" id="ra-i-${cid}"><input type="number" id="ra-h-${cid}"></div>
    <div class="res-inputs"><span>${nameHtml(b, { short: true })}</span><input type="number" id="rb-b-${cid}"><input type="number" id="rb-i-${cid}"><input type="number" id="rb-h-${cid}"></div>
    <div class="m-actions"><button class="btn" id="save-${cid}">✓ Speichern</button></div>`;
  const doSave = () => {
    const v = id => { const x = document.getElementById(id)?.value; return x === "" || x == null ? null : parseInt(x, 10); };
    const res = { a: { balls: v(`ra-b-${cid}`), innings: v(`ra-i-${cid}`), hs: v(`ra-h-${cid}`) }, b: { balls: v(`rb-b-${cid}`), innings: v(`rb-i-${cid}`), hs: v(`rb-h-${cid}`) } };
    if (res.a.balls == null || res.b.balls == null) { alert("Beide Ball-Ergebnisse eingeben."); return; }
    completeGame(key, res);
  };
  document.getElementById("save-" + cid).addEventListener("click", doSave);
  // Tastatur-Workflow: Enter in einem Feld speichert; erstes Feld autofokussieren.
  box.querySelectorAll("input").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSave(); } }));
  document.getElementById(`ra-b-${cid}`)?.focus();
}

// ===== ENDSTAND =====
function renderStandings() {
  const el = document.getElementById("tab-standings");
  if (!run) { el.innerHTML = `<div class="card"><p class="muted">Noch kein Turnier.</p></div>`; return; }

  el.innerHTML = `
    <div class="card"><h2>Endplatzierung</h2>
      ${runFinished(run) ? "" : `<div class="alert">Turnier läuft noch — Platzierungen vervollständigen sich mit den Ergebnissen.</div>`}
      <table class="standings-table"><thead><tr><th>Platz</th><th style="text-align:left">Spieler</th><th>Verein</th></tr></thead>
      <tbody>${rk.map(r => `<tr class="${r.place === 1 ? "q" : ""}"><td class="place">${r.place}</td><td style="text-align:left">${r.player ? nameHtml(r.player) : `<span class="muted">${escapeHtml(r.ref)}</span>`}</td><td>${r.player ? escapeHtml(r.player.club_shortname || "") : ""}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="card"><h2>Gruppen-Tabellen</h2><div class="groups-grid">${run.plan.groups.map(gr => groupCard(gr.n)).join("") || `<p class="muted">—</p>`}</div></div>

    <div class="card"><h2>Sicherung</h2><div class="toolbar"><button class="btn" id="btnBackup">💾 Sicherung speichern</button><button class="btn secondary" id="btnBackupCopy">📋 Sicherung kopieren</button></div><div class="scheme-hint">Nach jeder Runde sichern. Zurueckspielen auf der Turnier-Uebersicht (← oben links). Wichtig auf iPads: Safari kann den Speicher jederzeit leeren.</div></div>
    <div class="card"><h2>Export</h2><div class="toolbar"><button class="btn" id="btnCsv">📄 Spiele-CSV</button><button class="btn" id="btnRanking">📄 Rangliste (ClubCloud)</button>${isLive() ? `<button class="btn secondary" id="btnArchive">📦 Ergebnisse in Carambus ablegen</button><button class="btn danger" id="btnEnd">🧹 Turnier in Carambus abräumen (Tische frei + löschen)</button>` : ``}</div>${archiveStatusHtml()}<div class="scheme-hint">Endstand und Partien stehen jetzt auch in Carambus auf der Turnierseite — abgelegt wird nach jedem Ergebnis automatisch, der Knopf ist für den Nachschub von Hand. <strong>„Abräumen" löscht auch dieses Archiv</strong> (Turnier + Spiele + Endstand); danach ist die App wieder die einzige Quelle — vorher CSV sichern.</div></div>`;
  el.querySelector("#btnBackup")?.addEventListener("click", backupDownload);
  el.querySelector("#btnBackupCopy")?.addEventListener("click", backupCopy);

  el.querySelector("#btnRanking")?.addEventListener("click", exportRanking);
  el.querySelector("#btnArchive")?.addEventListener("click", () => pushArchive());
  el.querySelector("#btnEnd")?.addEventListener("click", endCarambus);

// Liste aller Spiele (wie im Dreiband-Matchschema) — nummeriert in Spielreihenfolge,
// mit Tisch, Spieler A/B, Bällen/Aufnahmen/HS/GD und Ergebnis (Sieger hervorgehoben).
function renderAllGamesList() {
  if (!run) return "";
  const tblByKey = {}; (state.records || []).forEach(r => { if (r.table != null) tblByKey[r.key] = r.table; });
  const gd = (b, i) => (b != null && i > 0 ? (b / i).toFixed(2) : "—");
  const num = v => (v == null ? "—" : v);
  const games = run.plan.games.slice().sort((a, b) => { const oa = csvOrder(a), ob = csvOrder(b); for (let i = 0; i < 3; i++) if (oa[i] !== ob[i]) return oa[i] - ob[i]; return String(a.key).localeCompare(String(b.key)); });
  const nameCell = (p, side, win) => `<td style="text-align:left;${win === side ? "color:var(--good);font-weight:600;" : ""}">${p ? nameHtml(p) : `<span class="muted">—</span>`}</td>`;
  const rows = games.map((g, i) => {
    const r = run.results[g.key];
    const a = r ? r.a : resolveSlot(run, g.a), b = r ? r.b : resolveSlot(run, g.b);
    const ra = r?.res?.a || {}, rb = r?.res?.b || {}, win = r?.winner;
    return `<tr>
      <td style="text-align:center;color:var(--muted);">${i + 1}</td>
      <td style="text-align:left;white-space:nowrap;">${escapeHtml(csvGameName(g))}${g.round ? ` <span class="muted">R${g.round}</span>` : ""}</td>
      <td style="text-align:center;">${tblByKey[g.key] != null ? escapeHtml(String(tblByKey[g.key])) : "—"}</td>
      ${nameCell(a, "a", win)}
      <td style="text-align:right;">${num(ra.balls)}</td><td style="text-align:right;">${num(ra.innings)}</td><td style="text-align:right;">${num(ra.hs)}</td><td style="text-align:right;font-family:monospace;color:var(--muted);">${gd(ra.balls, ra.innings)}</td>
      <td style="text-align:center;font-family:monospace;">${r ? `${num(ra.balls)}:${num(rb.balls)}` : "—"}</td>
      <td style="text-align:right;">${num(rb.balls)}</td><td style="text-align:right;">${num(rb.innings)}</td><td style="text-align:right;">${num(rb.hs)}</td><td style="text-align:right;font-family:monospace;color:var(--muted);">${gd(rb.balls, rb.innings)}</td>
      ${nameCell(b, "b", win)}
    </tr>`;
  }).join("");
  return `<div class="card"><h2>Alle Spiele</h2>
    <div class="toolbar"><button class="btn secondary" id="btnPrintGames">🖨 Drucken</button></div>
    <div style="overflow-x:auto;"><table class="standings-table" style="font-size:12px;white-space:nowrap;">
      <thead><tr><th>#</th><th style="text-align:left;">Spiel</th><th>Tisch</th><th style="text-align:left;">Spieler A</th><th>Bälle</th><th>Aufn.</th><th>HS</th><th>GD</th><th>Erg.</th><th>Bälle</th><th>Aufn.</th><th>HS</th><th>GD</th><th style="text-align:left;">Spieler B</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}
// Spielname für CSV (Carambus-Import-Format)
function csvGameName(g) {
  if (g.kind === "group") return `Gruppe ${g.group}`;
  const k = g.key;
  if (k === "fin") return "Finale";
  const hm = /^hf(\d*)$/.exec(k); if (hm) return "Halbfinale" + (hm[1] ? " " + hm[1] : "");
  const m = /^p<(\d+)-(\d+)>/.exec(k); if (m) return `Platz ${m[1]}/${m[2]}`;
  return gameLabel(g);
}
// lfd.nr-Reihenfolge: Runden-gestaffelt (Gruppenrunden 1..n je Gruppe), dann Platzierung
function csvOrder(g) {
  if (g.kind === "group") return [g.round || 0, 0, g.group || 0];
  const k = g.key; let p = 50;
  if (/^hf/.test(k)) p = 10; else if (k === "fin") p = 20; else { const m = /^p<(\d+)-/.exec(k); if (m) p = 30 + (+m[1]); }
  return [g.round || 99, 1, p];
}
// Spiele-CSV (gemeinsamer Baustein Carambus.util.buildGamesCsv) — Spiele in Spielreihenfolge.
// ===== Sicherung ==========================================================
// iOS-Safari raeumt localStorage bei Speicherdruck ohne Vorwarnung weg. Aus
// Carambus laesst sich der Stand NICHT zurueckholen (round_result verlangt
// tournament_cc_id, App-Turniere haben cc_id=nil) — deshalb hier eine echte
// Sicherung. Zurueckspielen auf der Turnier-Uebersicht (dort landet man nach
// einem Verlust, weil die Instanz dann nicht mehr existiert).
function backupPayload() { return { v: 1, at: new Date().toISOString(), instance: getInstance(INSTANCE_ID), state }; }
function backupFilename() {
  const t = (instance.title || "turnier").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  const d = new Date(); const p2 = n => String(n).padStart(2, "0");
  return `sicherung-${t}-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
}
function backupDownload() { Carambus.util.downloadJson(backupFilename(), backupPayload()); }
async function backupCopy() {
  const txt = JSON.stringify(backupPayload());
  try {
    await navigator.clipboard.writeText(txt);
    alert("Sicherung in der Zwischenablage.\n\nJetzt in eine Notiz (oder Mail an dich selbst) einfuegen und speichern.");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText = "position:fixed;inset:5%;width:90%;height:60%;z-index:9999;font-size:11px;";
    document.body.appendChild(ta); ta.select();
    alert("Bitte den markierten Text kopieren und in einer Notiz sichern. Danach irgendwo hinklicken.");
    ta.addEventListener("blur", () => ta.remove(), { once: true });
  }
}

function exportCsv() {
  const tsByKey = {}; (state.records || []).forEach(r => { if (r.at != null) tsByKey[r.key] = r.at; });
  const played = run.plan.games.filter(g => run.results[g.key]);
  played.sort((a, b) => { const oa = csvOrder(a), ob = csvOrder(b); for (let i = 0; i < 3; i++) if (oa[i] !== ob[i]) return oa[i] - ob[i]; return String(a.key).localeCompare(String(b.key)); });
  const games = played.map(g => { const r = run.results[g.key], ra = r.res.a || {}, rb = r.res.b || {}; return {
    name: csvGameName(g), dbuA: r.a?.dbu_nr ?? "", dbuB: r.b?.dbu_nr ?? "",
    ballsA: ra.balls ?? "", ballsB: rb.balls ?? "", inningsA: ra.innings ?? "", inningsB: rb.innings ?? "",
    hsA: ra.hs ?? "", hsB: rb.hs ?? "", at: tsByKey[g.key] }; });
  downloadText(`spiele-${planSlug()}-${new Date().toISOString().slice(0, 10)}.csv`, Carambus.util.buildGamesCsv(games));
}
// ClubCloud-Rangliste (gemeinsamer Baustein Carambus.util.buildRankingCsv). PASS-NR/VEREINSNR = cc_id.
function exportRanking() {
  const groupRankByPid = {};
  run.plan.groups.forEach(gr => { runGroupStandings(run, gr.n).forEach((s, i) => { groupRankByPid[pidOf(s.player)] = i + 1; }); });
  const rows = finalRanking(run).filter(r => r.player).map(r => { const p = r.player;
    const teil = `${p.lastname || ""}, ${p.firstname || ""}`.replace(/^,\s*|,\s*$/g, "").trim() || fullName(p);
    return { rang: r.place, punkte: "", gruppenrang: groupRankByPid[pidOf(p)] ?? "", passNr: p.cc_id ?? "", pga: "", vereinsNr: p.club_cc_id ?? "", teilnehmer: teil }; });
  downloadText(`rangliste-${planSlug()}-${new Date().toISOString().slice(0, 10)}.csv`, Carambus.util.buildRankingCsv(rows));
}
// ===== Ergebnisarchiv =====================================================
// Die App bleibt System of Record; der lokale Server bekommt zusaetzlich eine lesbare
// Kopie — Endstand und Partien in der Form, in der Carambus gescrapte CC-Ergebnisse
// haelt. Vertrag: HANDOFF-to-/from-carambus-tournament-result-archive.md.
// Die vier Anzeige-Zwaenge (gleiche Keys, Rank als Integer, "Ergebnis" nie leer,
// "Partie" numerisch) setzt der Kern durch — hier werden nur die Zeilen gebaut.

// Kennzahlen je Spieler ueber ALLE gespielten Partien: die Platzierung kommt aus
// finalRanking (Plan-Logik), die Zahlen daneben aus dem gesamten Turnier — sonst
// fehlten bei Plaenen mit Finalrunde genau die entscheidenden Spiele.
function archiveTotals() {
  const acc = new Map();
  const ensure = p => { const id = pidOf(p); if (!acc.has(id)) acc.set(id, { games: 0, wins: 0, draws: 0, points: 0, balls: 0, innings: 0, hs: 0 }); return acc.get(id); };
  run.plan.games.forEach(g => {
    const r = run.results[g.key]; if (!r) return;
    const A = ensure(r.a), B = ensure(r.b), ra = r.res?.a || {}, rb = r.res?.b || {};
    A.games++; B.games++;
    // Matchpunkte mitfuehren: Danach wird sortiert (run.order = ["points","gd"]), also
    // muss die Spalte in die Tabelle — sonst steht im Archiv ein Platz 3 mit schlechterer
    // GD ueber Platz 4 und sieht wie ein Fehler aus. Genau so passiert beim CEB-Turnier,
    // wo ein Unentschieden den Unterschied machte.
    A.points += r.pointsA || 0; B.points += r.pointsB || 0;
    if (r.winner === "a") A.wins++; else if (r.winner === "b") B.wins++; else { A.draws++; B.draws++; }
    A.balls += ra.balls || 0; A.innings += ra.innings || 0; if ((ra.hs || 0) > A.hs) A.hs = ra.hs;
    B.balls += rb.balls || 0; B.innings += rb.innings || 0; if ((rb.hs || 0) > B.hs) B.hs = rb.hs;
  });
  return acc;
}
function archiveName(p) { return `${p.lastname || ""}, ${p.firstname || ""}`.replace(/^,\s*|,\s*$/g, "").trim() || fullName(p); }
function archiveGd(balls, innings) { return innings > 0 ? (balls / innings).toFixed(3).replace(".", ",") : ""; }
function archiveStandings() {
  const tot = archiveTotals();
  // Zeilen ohne aufgeloesten Slot (Platz noch offen) gehoeren nicht ins Archiv;
  // Zeilen ohne Carambus-Player dagegen schon — sie tragen ihren Namen selbst.
  return Carambus.util.buildResultStandings(finalRanking(run).filter(r => r.player).map(r => {
    const p = r.player, s = tot.get(pidOf(p)) || { games: 0, wins: 0, draws: 0, points: 0, balls: 0, innings: 0, hs: 0 };
    return {
      player: Carambus.api.cleanPlayerRef(p),
      rank: r.place,
      columns: {
        "Rang": r.place,
        "Name": archiveName(p),
        "Land": p.nationality || "",
        "Verein": p.club_shortname || "",
        "Sp": s.games, "S": s.wins, "U": s.draws, "MP": s.points,
        "Baelle": s.balls, "Aufn.": s.innings,
        "GD": archiveGd(s.balls, s.innings),
        "HS": s.hs || ""
      }
    };
  }));
}
function archiveGames() {
  const tsByKey = {}, tblByKey = {};
  (state.records || []).forEach(r => { if (r.at != null) tsByKey[r.key] = r.at; if (r.table != null) tblByKey[r.key] = r.table; });
  const played = run.plan.games.filter(g => run.results[g.key]);
  played.sort((a, b) => { const oa = csvOrder(a), ob = csvOrder(b); for (let i = 0; i < 3; i++) if (oa[i] !== ob[i]) return oa[i] - ob[i]; return String(a.key).localeCompare(String(b.key)); });
  return Carambus.util.buildResultGames(played.map((g, i) => {
    const r = run.results[g.key], ra = r.res?.a || {}, rb = r.res?.b || {};
    const gd2 = (bl, inn) => (inn > 0 ? (bl / inn).toFixed(2).replace(".", ",") : "");
    return {
      gname: g.key, seqno: i + 1,
      group_no: g.kind === "group" ? (g.group ?? null) : null,
      round_no: g.round ?? null,
      table_no: Carambus.util.tableNo(tblByKey[g.key]),
      ended_at: tsByKey[g.key] ? new Date(tsByKey[g.key]).toISOString() : null,
      columns: {
        // Bewusst "Spieler A"/"Spieler B" statt "Heim"/"Gast": leere Heim/Gast-Spalten
        // brechen in der Carambus-Anzeige den Rest der Zeile ab.
        "Partie": i + 1,
        "Spiel": csvGameName(g),
        "Runde": g.round ?? "",
        "Tisch": tblByKey[g.key] ?? "",
        "Spieler A": r.a ? archiveName(r.a) : "",
        "Baelle A": ra.balls ?? "", "Aufn. A": ra.innings ?? "", "HS A": ra.hs ?? "", "GD A": gd2(ra.balls, ra.innings),
        "Ergebnis": `${ra.balls ?? "-"}:${rb.balls ?? "-"}`,
        "Spieler B": r.b ? archiveName(r.b) : "",
        "Baelle B": rb.balls ?? "", "Aufn. B": rb.innings ?? "", "HS B": rb.hs ?? "", "GD B": gd2(rb.balls, rb.innings)
      }
    };
  }));
}
// durable=false heisst: geschrieben, aber der naechtliche GC raeumt es noch ab
// (Carambus-Plan 41-02 fehlt). Der Text haengt am Serververhalten, nicht an einer
// Versionsannahme — er stimmt also von selbst, sobald Carambus ausliefert.
function archiveMessage(b) {
  const head = `${b.seedings_written ?? 0} Zeilen Endstand, ${b.games_written ?? 0} Partien.`;
  const un = (b.players_unmatched || []).length;
  const unTxt = un ? `\n\n${un} Spieler(in) ohne Carambus-Zuordnung — die Zeilen stehen trotzdem im Endstand.` : "";
  return b.durable
    ? `✅ Archiviert.\n\n${head}${unTxt}`
    : `💾 Gespeichert — noch nicht dauerhaft.\n\n${head}${unTxt}\n\nDer Server raeumt App-Turniere nachts noch ab. Bis Carambus das abstellt, schuetzt nur ein end_date in der Zukunft.`;
}
function archiveStatusHtml() {
  const a = state.archive; if (!a) return "";
  const when = new Date(a.at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
  if (a.error) return `<div class="scheme-hint" style="color:var(--bad);">Letzter Archiv-Versuch ${when} fehlgeschlagen: ${escapeHtml(a.error)}</div>`;
  return `<div class="scheme-hint">${a.durable ? "✅ Archiviert" : "💾 Gespeichert, noch nicht dauerhaft"} — ${when}, ${a.seedings ?? 0} Zeilen / ${a.games ?? 0} Partien${a.unmatched ? `, ${a.unmatched} ohne Zuordnung` : ""}.</div>`;
}
// silent=true ist der Automatik-Pfad nach jedem Ergebnis: er darf den Turnierbetrieb
// unter keinen Umstaenden aufhalten — Fehler landen im Status, nicht in einem Dialog.
async function pushArchive({ silent = false } = {}) {
  if (!isLive()) { if (!silent) alert("Nicht mit Carambus verbunden — Archivieren geht nur im Live-Modus."); return; }
  if (!run) return;
  try {
    const body = await Carambus.api.pushTournamentResult({
      ...tournamentApiRef(), scheme: "plan", title: "Endstand",
      standings: archiveStandings(), games: archiveGames()
    });
    state.archive = { at: Date.now(), durable: !!body.durable, seedings: body.seedings_written, games: body.games_written, unmatched: (body.players_unmatched || []).length };
    save();
    if (!silent) { alert(archiveMessage(body)); renderAll(); }
  } catch (e) {
    state.archive = { at: Date.now(), error: errMsg(e) }; save();
    if (!silent) alert("Archivieren fehlgeschlagen: " + errMsg(e));
    else console.warn("Auto-Archiv:", errMsg(e));
  }
}

async function endCarambus() {
  // Seit dem Ergebnisarchiv loescht cleanup mehr als frueher: auch den abgelegten Endstand.
  // Der naechtliche GC verschont archivierte Turniere (Carambus 41-02) — dieser Knopf nicht.
  const arch = (state.archive && !state.archive.error)
    ? `\n\nACHTUNG: Der bereits abgelegte Endstand (${state.archive.seedings ?? "?"} Zeilen, ${state.archive.games ?? "?"} Partien) wird damit ebenfalls gelöscht.`
    : "";
  if (!confirm(`Turnier in Carambus ABRÄUMEN?\n\nGibt alle Tische frei UND löscht Turnier + Spiele in Carambus.${arch}\n\nDie App bleibt Datenquelle; CSV vorher exportieren.`)) return;
  // tournamentApiRef() liefert im Attach-Modus die tournament_id, sonst die external_id
  // (inkl. deterministischem Fallback, falls die App den Turnierbezug verloren hat).
  // NICHT nur die external_id nehmen: Ein attachtes Turnier gehoert Carambus und hat
  // keine — der Server quittiert das mit 422 "Tournament not found".
  try {
    const body = await endTournament({ ...tournamentApiRef(), cleanup: true });
    alert(`Abgeräumt: ${body.released_tables ?? 0} Tische frei` + (body.tournament_deleted ? `, Turnier gelöscht` : `, Turnier nicht gefunden/bereits weg`) + (body.games_deleted != null ? `, ${body.games_deleted} Spiele gelöscht` : ""));
  } catch (e) { alert("Abräumen fehlgeschlagen: " + errMsg(e)); }
}

// ===== Helfer =====
function sameP(a, b) { if (a.cc_id != null && b.cc_id != null) return String(a.cc_id) === String(b.cc_id); return fullName(a) === fullName(b); }
function reseed() { state.participants = state.participants.map((p, i) => ({ ...p, seed: i + 1 })); }

renderAll();
</script>
</body>
