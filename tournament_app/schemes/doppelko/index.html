    const referencedWinner = new Set();
    for (const m of run.plan.matches) for (const r of [m.a, m.b]) if (r && r.winnerOf != null) referencedWinner.add(r.winnerOf);
    return run.plan.matches.filter(m => !referencedWinner.has(m.nr) && m.winnerRang == null).map(m => m.nr);
  }
  function drawLotsIfReady(run) {
    const slots = lotSlots(run);
    if (!slots.length || slots.every(k => run.lot[k])) return;
    const pool = lotPoolMatches(run);
    if (!pool.every(nr => { const m = run.matches.get(nr); return m.status === "done" || m.status === "bye"; })) return;
    const winners = run.shuffle(pool.map(nr => run.matches.get(nr).winner).filter(isPlayer));
    slots.forEach((k, i) => { if (winners[i]) run.lot[k] = winners[i]; });
  }

  function setOutcome(run, m, winnerSlot, result, bye) {
    const loserSlot = winnerSlot === "a" ? "b" : "a";
    m.winner = m[winnerSlot]; m.loser = m[loserSlot];
    m.result = result || null;
    m.status = bye ? "bye" : "done";
    if (!bye && isPlayer(m.loser)) {
      const prev = run.losses[pid(m.loser)] || 0;
      m.loserPriorLosses = prev;
      run.losses[pid(m.loser)] = prev + 1;
    }
  }

  function autoResolve(run) {
    let changed = true;
    while (changed) {
      changed = false;
      drawLotsIfReady(run);
      for (const nr of run.order) {
        const m = run.matches.get(nr);
        if (m.status !== "pending") continue;
        // bedingte Reset-Partie: nur aktiv, wenn der Verlierer von K ungeschlagen war (0 Niederlagen)
        const rs = resetSourceOf(m);
        if (rs != null) {
          const k = run.matches.get(rs);
          if (!k || k.status !== "done") continue;
          if ((k.loserPriorLosses ?? 1) !== 0) { m.status = "skipped"; changed = true; continue; }
        }
        const a = resolveRef(run, m.aRef, nr, "a"), b = resolveRef(run, m.bRef, nr, "b");
        if (!a || !b) continue;
        m.a = a; m.b = b;
        const aB = isBye(a), bB = isBye(b);
        if (aB || bB) { setOutcome(run, m, (aB && !bB) ? "b" : "a", null, true); changed = true; }
        else { m.status = "ready"; changed = true; }
      }
    }
  }

  function readyMatches(run) { return run.order.map(nr => run.matches.get(nr)).filter(m => m.status === "ready"); }
  function runningMatches(run) { return run.order.map(nr => run.matches.get(nr)).filter(m => m.status === "running"); }

  function recordMatch(run, nr, winnerSlot, result) {
    const m = run.matches.get(nr);
    if (!m) throw new Error("Unbekannte Partie: " + nr);
    if (m.status !== "ready" && m.status !== "running") throw new Error("Partie nicht spielbereit: " + nr);
    if (winnerSlot !== "a" && winnerSlot !== "b") throw new Error("Ungültiger Sieger-Slot");
    m.at = m.at || Date.now();
    setOutcome(run, m, winnerSlot, result, false);
    autoResolve(run);
    return m;
  }
  // Sieger aus Ergebnis ableiten (mehr Bälle gewinnt; null bei Gleichstand → Schema entscheidet/los).
  function winnerFromResult(result) {
    if (!result) return null;
    const a = result.a && result.a.balls, b = result.b && result.b.balls;
    if (a == null || b == null) return null;
    return a > b ? "a" : b > a ? "b" : null;
  }

  // Endplatzierung: Rang aus dem Plan; spätere Partien (höhere nr) überschreiben provisorische Ränge.
  function placements(run) {
    const byPid = new Map();
    for (const nr of [...run.order].sort((x, y) => x - y)) {
      const m = run.matches.get(nr);
      if (m.status !== "done") continue;
      if (m.winnerRang != null && isPlayer(m.winner)) byPid.set(pid(m.winner), { player: m.winner, place: m.winnerRang });
      if (m.loserRang != null && isPlayer(m.loser)) byPid.set(pid(m.loser), { player: m.loser, place: m.loserRang });
    }
    return [...byPid.values()].sort((a, b) => a.place - b.place || (a.player.seed ?? 0) - (b.player.seed ?? 0));
  }

  function isFinished(run) {
    return run.order.every(nr => { const s = run.matches.get(nr).status; return s === "done" || s === "bye" || s === "skipped"; });
  }
  // Gespielte echte Partien (keine Freilose/Resets) in Plan-Reihenfolge — für Spiele-CSV / „Alle Spiele".
  function playedGames(run) {
    return run.order.map(nr => run.matches.get(nr)).filter(m => m.status === "done" && isPlayer(m.a) && isPlayer(m.b));
  }

  return { BYE, isBye, isPlayer, pid, buildRun, autoResolve, resolveRef, readyMatches, runningMatches, recordMatch, winnerFromResult, placements, isFinished, playedGames, resetSourceOf };
});
/* <<< CARAMBUS-SYNC ko-engine <<< */
</script>

<!-- KO-Controller (nutzt window.Carambus + window.KO + window.KO_PLANS) -->
<script>
"use strict";
const { getConnection, isBearerValid, regionShortname, CarambusError, mountConnectionWidget } = Carambus;
const { fetchClubs, fetchClubPlayers, fetchPlayerRankings, fetchTables,
        createTournament, lockTable, startGame, acknowledgeResult, endTournament, cleanPlayerRef } = Carambus.api;
const { loadInstanceState, saveInstanceState, getInstance, updateInstance } = Carambus.storage;
const { escapeHtml, fmtAvg, calcAvg, csvCell, buildCsv, downloadText, shuffle, tableNo } = Carambus.util;

const SCHEME_ID = "doppelko";
const isBye = KO.isBye, isPlayer = KO.isPlayer;

// ===== Plan-Registry (window.KO_PLANS, inline aus schemes/ko/plans.js) =====
const PLANS = (window.KO_PLANS && window.KO_PLANS.plans) || [];
const DEFAULT_PLAN_ID = "DKO-008 (Doppel-KO)";
function findPlan(id) { return PLANS.find(p => p.id === id) || null; }
function curPlan() { return findPlan(state.planId) || findPlan(DEFAULT_PLAN_ID) || PLANS[0] || null; }
function planSize() { const p = curPlan(); return p ? p.size : 32; }

// Turnier-Instanz aus der URL (?t=<id>). Ohne gültige Instanz zurück zur Übersicht
// (mehrere parallele Turniere = mehrere Instanzen, jede mit eigenem State).
const INSTANCE_ID = new URLSearchParams(location.search).get("t");
const instance = INSTANCE_ID ? getInstance(INSTANCE_ID) : null;
if (!INSTANCE_ID || !instance) {
  location.replace("../../index.html");
  throw new Error("Keine Turnier-Instanz (?t=) — zurück zur Übersicht.");
}

// Disziplin-Namen wie in Carambus. Pool/Snooker liefern über Carambus.util.freeGameForm das
// richtige Scoreboard (free_game_form "pool"/"snooker"); alles andere → Karambol.
const DISCIPLINES = ["Dreiband klein", "3-Band", "Cadre 47/2", "Cadre 71/2", "Einband", "Freie Partie", "9-Ball", "8-Ball", "10-Ball", "14.1 endlos", "Snooker"];
function disciplineOptions(current) {
  const list = DISCIPLINES.slice();
  if (current && !list.includes(current)) list.unshift(current);
  return list.map(d => `<option value="${escapeHtml(d)}"${d === current ? " selected" : ""}>${escapeHtml(d)}</option>`).join("")
    + `<option value="__custom__">Andere …</option>`;
}

// KO-Plan-Auswahl (gruppiert nach Typ). Quelle: window.KO_PLANS (alle ClubCloud-Pläne).
function planOptions(currentId) {
  const order = ["DKO", "DKO+EKO", "EKO"];
  const label = { DKO: "Doppel-KO", "DKO+EKO": "Doppel-KO + Trostrunde (Hybrid)", EKO: "Einfach-KO" };
  const groups = {};
  for (const p of PLANS) (groups[p.type] = groups[p.type] || []).push(p);
  const keys = [...order.filter(k => groups[k]), ...Object.keys(groups).filter(k => !order.includes(k))];
  return keys.map(k =>
    `<optgroup label="${escapeHtml(label[k] || k)}">` +
    groups[k].slice().sort((a, b) => a.size - b.size).map(p =>
      `<option value="${escapeHtml(p.id)}"${p.id === currentId ? " selected" : ""}>${escapeHtml(p.id)} — bis ${p.size} Spieler</option>`
    ).join("") + `</optgroup>`
  ).join("");
}
function planSummary() {
  const p = curPlan();
  if (!p) return `<span class="bad">Keine KO-Pläne geladen.</span>`;
  const desc = { DKO: "Doppel-KO (doppelte Eliminierung, mit Bracket-Reset)", "DKO+EKO": "Doppel-KO mit Einfach-KO-Trostrunde", EKO: "Einfach-KO (einfache Eliminierung)" }[p.type] || p.type;
  return `${escapeHtml(desc)} · bis ${p.size} Spieler · ${p.matches.length} Partien.`;
}

// Format-Felder je nach Spielform: Karambol (Distanz/Aufnahmen/Nachstoß) vs Pool (Ausspielziel
// pro Satz, 0=unbegrenzt + Sätze Best-of-#) vs Snooker (Frames Best-of-# + Rote Kugeln).
function formatFields() {
  const ff = Carambus.util.freeGameForm({ tableKind: state.disciplineTableKind, discipline: state.discipline });
  if (ff === "pool") return `
    <div><label class="muted">Ausspielziel (0 = unbegrenzt)</label><input type="number" id="inPoolGoal" value="${state.format.pool_balls_goal ?? 0}"></div>
    <div><label class="muted">Sätze (Best-of-#)</label><input type="number" id="inBestOf" value="${state.format.pool_best_of ?? 1}"></div>`;
  if (ff === "snooker") return `
    <div><label class="muted">Frames (Best-of-#)</label><input type="number" id="inBestOf" value="${state.format.pool_best_of ?? 1}"></div>
    <div><label class="muted">Rote Kugeln</label><select id="inReds" style="width:auto;">${[6, 10, 15].map(r => `<option value="${r}"${(state.format.initial_red_balls ?? 15) === r ? " selected" : ""}>${r} Reds</option>`).join("")}</select></div>`;
  return `
    <div><label class="muted">Distanz (Bälle)</label><input type="number" id="inTarget" value="${state.format.target_points ?? 30}"></div>
    <div><label class="muted">Aufnahmen-Limit</label><input type="number" id="inInnings" value="${state.format.innings_goal ?? 25}"></div>
    <div><label class="muted">Nachstoß</label><label style="display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap;"><input type="checkbox" id="inFollowUp" style="width:auto;" ${state.format.allow_follow_up !== false ? "checked" : ""}> zulassen</label></div>`;
}

// Start-Parameter für start_game je Spielform. Pool/Snooker: Best-of-N → sets_to_play=N,
// sets_to_win=⌈N/2⌉ (beide müssen an die API; sie rechnet nichts um); innings_goal=0.
function gameFormat() {
  const ff = Carambus.util.freeGameForm({ tableKind: state.disciplineTableKind, discipline: state.discipline });
  if (ff === "pool" || ff === "snooker") {
    const bestOf = Math.max(1, parseInt(state.format.pool_best_of, 10) || 1);
    const f = {
      free_game_form: ff,
      balls_goal: ff === "pool" ? (state.format.pool_balls_goal ?? 0) : 0, // Ausspielziel/Satz (Pool: nur 14.1 wirksam)
      innings_goal: 0, sets_to_play: bestOf, sets_to_win: Math.ceil(bestOf / 2), allow_follow_up: false
    };
    if (ff === "snooker") f.initial_red_balls = state.format.initial_red_balls ?? 15;
    return f;
  }
  return {
    free_game_form: "karambol", balls_goal: state.format.target_points ?? 30,
    innings_goal: state.format.innings_goal ?? 25, sets_to_play: 1, sets_to_win: 1,
    allow_follow_up: state.format.allow_follow_up ?? true
  };
}

function defaultState() {
  return {
    phase: "setup",
    planId: DEFAULT_PLAN_ID,
    // Vom Launcher (Meldelisten-Auswahl) ggf. vorbelegte Disziplin verwenden.
    discipline: (instance && instance.discipline) || "Dreiband klein",
    format: { target_points: 30, innings_goal: 25, free_game_form: "karambol", allow_follow_up: true, pool_balls_goal: 0, pool_best_of: 1, initial_red_balls: 15 },
    location: null,
    locationInput: "",
    clubs: [],
    rosterByClub: {},
    selectedClubCc: null,
    filterAgeClass: null,
    filterGender: null,
    // Vorbelegung aus dem Carambus-Chat-Workflow (cc_open_in_tournament_app):
    // instance.preselected_players → direkt als Setzliste (seeding-Endpoint liefert in
    // Setzplatz-Reihenfolge, daher .map mit seed-Index reicht).
    participants: ((instance && Array.isArray(instance.preselected_players)) ? instance.preselected_players.map((p, i) => ({ ...p, seed: i + 1 })) : []),
    tables: [],
    availableTables: [],
    carambusTournament: null,
    run: null
  };
}

let state = loadInstanceState(INSTANCE_ID, defaultState);
if (!state.planId) state.planId = DEFAULT_PLAN_ID;
let run = deserializeRun(state.run);

function save() {
  state.run = serializeRun(run);
  saveInstanceState(INSTANCE_ID, state);
  // Metadaten für die Turnier-Übersicht (Manager) mitschreiben.
  const champ = championOf(run);
  updateInstance(INSTANCE_ID, {
    discipline: state.discipline,
    players: state.participants.length,
    phase: state.phase,
    champion: champ ? fullName(champ) : null
  });
}

// ===== Persistenz: Engine-Run ⇄ JSON =====
// Spieler-Referenzen werden als pid serialisiert und beim Laden über run.players
// re-verknüpft (Referenzgleichheit m.winner===m.a wird im Render gebraucht).
const pidOf = p => isBye(p) ? "__bye" : (p ? KO.pid(p) : null);
function serializeRun(r) {
  if (!r) return null;
  return {
    planId: state.planId,
    players: r.players,
    losses: r.losses,
    lot: Object.fromEntries(Object.entries(r.lot || {}).map(([k, v]) => [k, pidOf(v)])),
    order: r.order,
    matches: [...r.matches.values()].map(m => ({
      nr: m.nr, round: m.round, aRef: m.aRef, bRef: m.bRef,
      winnerRang: m.winnerRang, loserRang: m.loserRang,
      a: pidOf(m.a), b: pidOf(m.b), winner: pidOf(m.winner), loser: pidOf(m.loser),
      loserPriorLosses: m.loserPriorLosses, status: m.status, result: m.result,
      at: m.at, table: m.table, tablePlayed: m.tablePlayed,
      external_id: m.external_id, cbState: m.cbState
    }))
  };
}
function deserializeRun(s) {
  if (!s) return null;
  const plan = findPlan(s.planId) || curPlan();
  const byPid = new Map((s.players || []).map(p => [KO.pid(p), p]));
  const ref = v => v == null ? null : (v === "__bye" ? KO.BYE : (byPid.get(v) || null));
  const matches = new Map();
  for (const m of (s.matches || [])) matches.set(m.nr, {
    nr: m.nr, round: m.round, aRef: m.aRef, bRef: m.bRef,
    winnerRang: m.winnerRang ?? null, loserRang: m.loserRang ?? null,
    a: ref(m.a), b: ref(m.b), winner: ref(m.winner), loser: ref(m.loser),
    loserPriorLosses: m.loserPriorLosses ?? null, status: m.status || "pending",
    result: m.result || null, at: m.at ?? null, table: m.table ?? null,
    tablePlayed: m.tablePlayed ?? null, external_id: m.external_id ?? null, cbState: m.cbState ?? null
  });
  const lot = {};
  for (const [k, v] of Object.entries(s.lot || {})) lot[k] = v == null ? null : (byPid.get(v) || null);
  return { plan, players: s.players || [], matches, order: s.order || [], lot, losses: s.losses || {}, shuffle };
}

// Champion = Spieler auf Rang 1 (taucht erst auf, wenn die Finalpartie gespielt ist).
function championOf(r) {
  if (!r) return null;
  const p1 = KO.placements(r).find(x => x.place === 1);
  return p1 ? p1.player : null;
}
function runProgress(r) {
  let total = 0, done = 0, ready = 0, running = 0;
  if (r) for (const nr of r.order) {
    const m = r.matches.get(nr);
    if (!m || m.status === "skipped" || m.status === "bye") continue;
    total++;
    if (m.status === "done") done++;
    else if (m.status === "ready") ready++;
    else if (m.status === "running") running++;
  }
  return { total, done, ready, running, finished: r ? KO.isFinished(r) : false };
}
// Aktive Reset-/Entscheidungspartie (nur DKO/Hybride): beide Slots stammen aus derselben Partie.
function activeResetMatch(r) {
  if (!r) return null;
  for (const nr of r.order) {
    const m = r.matches.get(nr);
    if (!m || m.status === "skipped" || m.status === "bye") continue;
    if (KO.resetSourceOf(m) != null && (m.status === "ready" || m.status === "running")) return m;
  }
  return null;
}

function isLive() {
  const c = getConnection();
  return !!(c.base_url && isBearerValid(c));
}

function disciplineSlug() {
  return (state.discipline || "disziplin").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function tournamentExternalId() {
  // Eindeutig pro Instanz (sonst kollidieren parallele Turniere gleicher Disziplin).
  return `app-${INSTANCE_ID}`;
}
function gameExternalId(nr) {
  const ext = state.carambusTournament?.external_id || tournamentExternalId();
  return `${ext}-P${nr}`;
}

const connWidget = mountConnectionWidget({ badgeEl: document.getElementById("connBadge"), onChange: renderAll });

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
    document.getElementById("tab-" + tab).style.display = "";
  });
});

function renderAll() {
  connWidget.refresh();
  renderMeta();
  renderSetup();
  renderGames();
  renderStandings();
}

function renderMeta() {
  const pr = runProgress(run);
  const parts = [];
  parts.push(`<strong>${escapeHtml(instance.title)}</strong>`);
  if (instance.category) parts.push(`<span class="gold">${escapeHtml(instance.category)}</span>`);
  parts.push(escapeHtml(state.planId));
  parts.push(escapeHtml(state.discipline));
  if (state.participants.length) parts.push(`${state.participants.length} Spieler`);
  if (state.tables.length) parts.push(`${state.tables.length} Tische`);
  if (run) parts.push(`${pr.done}/${pr.total} Spiele`);
  if (!isLive()) parts.push(`<span class="muted">lokal/offline</span>`);
  document.getElementById("metaInfo").innerHTML = parts.join(" · ");
  document.title = `${instance.title} — KO-System`;
}

// ===== SETUP =====
function renderSetup() {
  const el = document.getElementById("tab-setup");
  if (state.phase !== "setup") {
    el.innerHTML = `
      <div class="card">
        <h2>Turnier läuft</h2>
        <div class="info">Das Bracket ist erzeugt (Plan <strong>${escapeHtml(state.planId)}</strong>). Spiele werden im Tab <strong>„Spiele &amp; Bracket"</strong> gestartet.</div>
        <button class="btn danger" id="btnResetTournament">⟲ Turnier verwerfen &amp; neu aufsetzen</button>
      </div>`;
    el.querySelector("#btnResetTournament").addEventListener("click", resetTournament);
    return;
  }

  const live = isLive();
  const nSel = state.participants.length;
  const mx = planSize();
  const demoN = Math.min(mx, 32);

  el.innerHTML = `
    <div class="card">
      <h2>1 · KO-System &amp; Disziplin</h2>
      <div style="margin-bottom:14px;">
        <label class="muted">KO-Plan (ClubCloud) — bestimmt Brackettyp &amp; maximale Teilnehmerzahl</label>
        <select id="inPlan">${planOptions(state.planId)}</select>
        <div class="muted" style="font-size:12px;margin-top:4px;">${planSummary()}</div>
      </div>
      <div class="grid-2col">
        <div>
          <label class="muted">Disziplin (muss zum Carambus-Ranking passen)</label>
          <select id="inDiscipline">${disciplineOptions(state.discipline)}</select>
          <div class="muted" style="font-size:12px;margin-top:4px;">Scoreboard: <strong>${({ pool: "Pool", snooker: "Snooker", karambol: "Karambol" })[Carambus.util.freeGameForm({ discipline: state.discipline })]}</strong></div>
        </div>
        <div style="display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;">${formatFields()}</div>
      </div>
    </div>

    <div class="card">
      <h2>2 · Teilnehmer <span class="badge ${nSel >= 2 && nSel <= mx ? 'done' : 'open'}">${nSel} / 2–${mx}</span></h2>
      <div class="toolbar">
        ${live ? `<button class="btn secondary" id="btnLoadClubs">📥 Clubs laden</button>` : ``}
        <button class="btn secondary" id="btnDemo">🎲 Demo-Teilnehmer (${demoN})</button>
        ${nSel ? `<button class="btn secondary" id="btnClearParticipants">Leeren</button>` : ``}
        ${live && nSel >= 2 ? `<button class="btn secondary" id="btnRank">📊 Nach Ranking sortieren</button>` : ``}
        <button class="btn secondary" id="btnShuffleSeed" ${nSel < 2 ? "disabled" : ""}>🔀 Zufällig setzen</button>
      </div>
      <div id="playerPickerBox">${renderPlayerPicker()}</div>
      <div class="muted" style="font-size:12px;margin:10px 0 4px;">Setzliste${nSel ? ` → Plan-Größe ${mx} (${Math.max(0, mx - nSel)} Freilose)` : ``} — Reihenfolge = Setzplatz (▲▼ verschieben, ✕ entfernen).</div>
      <div id="seedBox">${renderSeedList()}</div>
    </div>

    <div class="card">
      <h2>3 · Tische</h2>
      <div class="toolbar">
        <input type="text" id="inLocation" placeholder="Location-id oder cc_id" value="${escapeHtml(state.locationInput || "")}" style="max-width:220px;">
        ${live ? `<button class="btn" id="btnLoadTables">📥 Tische aus Carambus laden</button>` : ``}
        <button class="btn secondary" id="btnAddTable">+ Tisch manuell</button>
      </div>
      <div id="tablesBox">${renderTableSelect()}</div>
    </div>

    <div class="card">
      <h2>4 · Start</h2>
      <div id="startHints"></div>
      <button class="btn" id="btnStart">🏁 Turnier anlegen &amp; Bracket erzeugen</button>
    </div>`;

  el.querySelector("#inPlan").addEventListener("change", e => {
    state.planId = e.target.value; save(); renderMeta(); renderSetup();
  });
  el.querySelector("#inDiscipline").addEventListener("change", e => {
    if (e.target.value === "__custom__") {
      const v = prompt("Disziplin (genau wie in Carambus):", state.discipline);
      if (v && v.trim()) state.discipline = v.trim();
    } else {
      state.discipline = e.target.value;
    }
    save(); renderMeta(); renderSetup();
  });
  el.querySelector("#inTarget")?.addEventListener("change", e => { state.format.target_points = parseInt(e.target.value, 10) || 30; save(); });
  el.querySelector("#inInnings")?.addEventListener("change", e => { state.format.innings_goal = parseInt(e.target.value, 10) || 25; save(); });
  el.querySelector("#inFollowUp")?.addEventListener("change", e => { state.format.allow_follow_up = e.target.checked; save(); });
  el.querySelector("#inPoolGoal")?.addEventListener("change", e => { state.format.pool_balls_goal = Math.max(0, parseInt(e.target.value, 10) || 0); save(); });
  el.querySelector("#inBestOf")?.addEventListener("change", e => { state.format.pool_best_of = Math.max(1, parseInt(e.target.value, 10) || 1); save(); });
  el.querySelector("#inReds")?.addEventListener("change", e => { state.format.initial_red_balls = parseInt(e.target.value, 10) || 15; save(); });

  el.querySelector("#btnLoadClubs")?.addEventListener("click", loadClubs);
  el.querySelector("#btnDemo")?.addEventListener("click", () => { addDemoParticipants(demoN); });
  el.querySelector("#btnClearParticipants")?.addEventListener("click", () => { state.participants = []; state.selectedClubCc = null; save(); renderSetup(); });
  el.querySelector("#btnRank")?.addEventListener("click", rankParticipants);
  el.querySelector("#btnShuffleSeed")?.addEventListener("click", () => { state.participants = shuffle(state.participants).map((p, i) => ({ ...p, seed: i + 1 })); save(); renderSetup(); });
  el.querySelector("#inLocation")?.addEventListener("change", e => { state.locationInput = e.target.value.trim(); save(); });
  el.querySelector("#btnLoadTables")?.addEventListener("click", loadTables);
  el.querySelector("#btnAddTable")?.addEventListener("click", addManualTable);
  el.querySelector("#btnStart").addEventListener("click", startTournament);

  bindPlayerPicker(el);
  bindSeedButtons(el);
  bindTableCheckboxes(el);
  renderStartHints();
}

// Stammvereine (NBV Karambol/Kegel) — stehen im Verein-Dropdown oben unter „★ Häufig".
// Match über shortname (eindeutig); identisch zum plan-Schema.
const FAVORITE_CLUB_SHORTNAMES = ["BC Bergedorf", "BC Wedel", "BG Hamburg", "TSV Neudorf"];
const normClub = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
const FAVORITE_SET = new Set(FAVORITE_CLUB_SHORTNAMES.map(normClub));
function isFavoriteClub(c) { return FAVORITE_SET.has(normClub(c.shortname)) || FAVORITE_SET.has(normClub(c.name)); }

// Zweistufige Teilnehmer-Auswahl (wie im plan-Schema): Verein-Dropdown (Stammvereine oben)
// → Spieler-Dropdown des gewählten Vereins; Auswahl wird SOFORT übernommen (kein Extra-Button).
// Roster wird beim Vereinswählen lazy geladen. Korrektur per ✕ in der Setzliste.
function renderPlayerPicker() {
  if (!state.clubs.length) return isLive()
    ? `<p class="muted">„📥 Clubs laden", dann Verein und Spieler wählen.</p>`
    : `<p class="muted">Offline — Demo-Teilnehmer nutzen, oder mit Carambus verbinden für echte Spieler.</p>`;
  const byShort = (a, b) => String(a.shortname || a.name).localeCompare(String(b.shortname || b.name), "de");
  const favs = state.clubs.filter(isFavoriteClub).sort(byShort);
  const rest = state.clubs.filter(c => !isFavoriteClub(c)).sort(byShort);
  const optClub = c => `<option value="${c.cc_id}"${String(c.cc_id) === String(state.selectedClubCc) ? " selected" : ""}>${escapeHtml(c.shortname || c.name)}</option>`;
  const clubOpts = `<option value="">— Verein wählen —</option>`
    + (favs.length ? `<optgroup label="★ Häufig">${favs.map(optClub).join("")}</optgroup>` : ``)
    + `<optgroup label="Alle Vereine">${rest.map(optClub).join("")}</optgroup>`;

  // Phase 21-07: optionale Filter-Selektoren (Altersklasse/Geschlecht) — client-seitig
  // angewendet (Werte aus allen bereits geladenen Rostern, exakter Match auf Carambus-Strings).
  const ages = distinctRosterValues("age_class");
  const genders = distinctRosterValues("gender");
  const ageOpts = `<option value="">— alle —</option>` + ages.map(a => `<option value="${escapeHtml(a)}"${a === state.filterAgeClass ? " selected" : ""}>${escapeHtml(a)}</option>`).join("");
  const genderLabel = g => ({ M: "M (Männlich)", F: "F (Weiblich)", U: "U (Unbekannt)" })[g] || g;
  const genOpts = `<option value="">— alle —</option>` + genders.map(g => `<option value="${escapeHtml(g)}"${g === state.filterGender ? " selected" : ""}>${escapeHtml(genderLabel(g))}</option>`).join("");
  const showFilters = ages.length || genders.length;

  const cc = state.selectedClubCc;
  const roster = cc != null ? state.rosterByClub[cc] : null;
  let playerOpts, playerDisabled = "";
  if (cc == null) { playerOpts = `<option value="">— erst Verein wählen —</option>`; playerDisabled = "disabled"; }
  else if (!roster) { playerOpts = `<option value="">lädt …</option>`; playerDisabled = "disabled"; }
  else {
    const ageF = state.filterAgeClass || null, genF = state.filterGender || null;
    const avail = roster
      .filter(p => !state.participants.some(x => sameP(x, p)))
      .filter(p => !ageF || p.age_class === ageF)
      .filter(p => !genF || p.gender === genF);
    if (!avail.length) { playerOpts = `<option value="">${(ageF || genF) ? "— keine passenden Spieler —" : "— alle hinzugefügt —"}</option>`; playerDisabled = "disabled"; }
    else playerOpts = `<option value="">— Spieler wählen —</option>` + avail.map(p => {
      const val = p.cc_id != null ? String(p.cc_id) : "nm:" + fullName(p);
      const suf = [p.dbu_nr, Carambus.util.playerAgeGender(p)].filter(Boolean).join(" · ");
      return `<option value="${escapeHtml(val)}" data-name="${escapeHtml(fullName(p))}">${escapeHtml(fullName(p))}${suf ? " · " + escapeHtml(suf) : ""}</option>`;
    }).join("");
  }
  return `${showFilters ? `<div class="grid-2col" style="grid-template-columns:1fr 1fr;align-items:end;gap:8px;margin-bottom:6px;">
      <div><label class="muted">Altersklasse-Filter</label><select id="inFilterAge">${ageOpts}</select></div>
      <div><label class="muted">Geschlecht-Filter</label><select id="inFilterGender">${genOpts}</select></div>
    </div>` : ``}
    <div class="grid-2col" style="grid-template-columns:1fr 1fr;align-items:end;gap:8px;">
      <div><label class="muted">Verein</label><select id="inClubSel">${clubOpts}</select></div>
      <div><label class="muted">Spieler → sofort übernommen</label><select id="inPlayerSel" ${playerDisabled}>${playerOpts}</select></div>
    </div>`;
}
// Verschiedene Werte eines Feldes über alle geladenen Vereins-Roster (Quelle für die Filter-Listen).
function distinctRosterValues(field) {
  const set = new Set();
  for (const cc in state.rosterByClub) (state.rosterByClub[cc] || []).forEach(p => { if (p && p[field]) set.add(p[field]); });
  return [...set].sort((a, b) => String(a).localeCompare(String(b), "de"));
}
function bindPlayerPicker(el) {
  el.querySelector("#inClubSel")?.addEventListener("change", async e => {
    const cc = e.target.value || null;
    state.selectedClubCc = cc; save();
    if (cc != null && !state.rosterByClub[cc]) {
      renderSetup(); // zeigt „lädt …"
      try { state.rosterByClub[cc] = await fetchClubPlayers(cc); save(); } catch (err) { alert("Spieler laden: " + errMsg(err)); }
    }
    renderSetup();
  });
  // Spielerauswahl wird sofort übernommen (kein Extra-Button).
  el.querySelector("#inPlayerSel")?.addEventListener("change", () => addSelectedPlayer(el));
  el.querySelector("#inFilterAge")?.addEventListener("change", e => { state.filterAgeClass = e.target.value || null; save(); renderSetup(); });
  el.querySelector("#inFilterGender")?.addEventListener("change", e => { state.filterGender = e.target.value || null; save(); renderSetup(); });
}
function addSelectedPlayer(el) {
  const cc = state.selectedClubCc; if (cc == null) return;
  const sel = el.querySelector("#inPlayerSel"); const val = sel ? sel.value : "";
  if (!val) return;
  if (state.participants.length >= planSize()) { alert(`Plan „${state.planId}" erlaubt höchstens ${planSize()} Spieler.`); return; }
  const roster = state.rosterByClub[cc] || [];
  const p = val.startsWith("nm:") ? roster.find(r => fullName(r) === val.slice(3)) : roster.find(r => String(r.cc_id) === String(val));
  if (!p) return;
  const club = state.clubs.find(c => String(c.cc_id) === String(cc));
  const src = { ...p, club_cc_id: cc, club_shortname: club ? (club.shortname || club.name) : "", rank: null, gd: null };
  if (!state.participants.some(x => sameP(x, src))) state.participants.push(src);
  reseed(); save(); renderSetup();
}

function renderSeedList() {
  if (!state.participants.length) return `<p class="muted">Noch keine Teilnehmer.</p>`;
  return `<div class="seed-list">` + state.participants.map((p, i) => `
    <div class="seed-row">
      <span class="rank">${i + 1}</span>
      <span>${escapeHtml(fullName(p))} <span class="club">${escapeHtml(p.club_shortname || "")}${(p.age_class || p.gender) ? " · " + escapeHtml(Carambus.util.playerAgeGender(p)) : ""}</span></span>
      <span class="${p.rank == null ? "noseed" : "muted"}">${p.rank == null ? "kein Ranking" : "Rang " + p.rank}</span>
      <span class="gd">${p.gd != null ? Number(p.gd).toFixed(3) : ""}</span>
      <span class="ord"><button data-up="${i}">▲</button><button data-down="${i}">▼</button><button class="seed-rm" data-cc="${p.cc_id ?? ""}" data-name="${escapeHtml(fullName(p))}" title="Entfernen">✕</button></span>
    </div>`).join("") + `</div>`;
}
function bindSeedButtons(el) {
  el.querySelectorAll(".ord button[data-up]").forEach(b => b.addEventListener("click", () => moveSeed(+b.dataset.up, -1)));
  el.querySelectorAll(".ord button[data-down]").forEach(b => b.addEventListener("click", () => moveSeed(+b.dataset.down, +1)));
  el.querySelectorAll(".seed-rm").forEach(b => b.addEventListener("click", e => {
    const cc = e.currentTarget.dataset.cc || null, name = e.currentTarget.dataset.name;
    state.participants = state.participants.filter(x => !(cc ? String(x.cc_id) === cc : fullName(x) === name));
    reseed(); save(); renderSetup();
  }));
}
function moveSeed(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= state.participants.length) return;
  const a = state.participants;
  [a[i], a[j]] = [a[j], a[i]];
  reseed(); save(); renderSetup();
}

function renderTableSelect() {
  const avail = state.availableTables.length ? state.availableTables : state.tables.map(n => ({ name: n }));
  if (!avail.length) return `<p class="muted">Tische aus Carambus laden oder manuell hinzufügen.</p>`;
  return `<div class="pool-list">` + avail.map(t => {
    const checked = state.tables.includes(t.name);
    const busy = t.in_tournament ? ` <span class="club">(anderes Turnier)</span>` : "";
    return `<label class="pool-row">
      <input type="checkbox" class="tbl-cb" data-name="${escapeHtml(t.name)}" ${checked ? "checked" : ""}>
      <span>${escapeHtml(t.name)} <span class="club">${escapeHtml(t.table_kind || "")}</span>${busy}</span>
      <span></span>
    </label>`;
  }).join("") + `</div>`;
}
function bindTableCheckboxes(el) {
  el.querySelectorAll(".tbl-cb").forEach(cb => cb.addEventListener("change", e => {
    const name = e.target.dataset.name;
    if (e.target.checked) { if (!state.tables.includes(name)) state.tables.push(name); }
    else state.tables = state.tables.filter(n => n !== name);
    save(); renderMeta(); renderStartHints();
  }));
}

function renderStartHints() {
  const hints = [];
  const n = state.participants.length, mx = planSize();
  if (n < 2) hints.push(`Mindestens 2 Teilnehmer (aktuell ${n}).`);
  if (n > mx) hints.push(`Der Plan „${state.planId}" erlaubt höchstens ${mx} Teilnehmer (aktuell ${n}). Größeren Plan wählen.`);
  if (!state.tables.length) hints.push("Mindestens einen Tisch wählen.");
  if (isLive() && (!state.location || (state.location.id == null && state.location.cc_id == null))) hints.push("Live-Modus: Location/Tische aus Carambus laden (für die Tisch-Bindung).");
  const box = document.getElementById("startHints");
  const btn = document.getElementById("btnStart");
  if (!box || !btn) return;
  if (hints.length) {
    box.innerHTML = `<div class="alert">${hints.map(escapeHtml).join("<br>")}</div>`;
    btn.disabled = true;
  } else {
    box.innerHTML = `<div class="info">${isLive() ? "Live-Modus: Turnier wird in Carambus angelegt und die Tische gebunden." : "Lokal-Modus: Bracket nur in der App (Ergebnisse manuell)."}</div>`;
    btn.disabled = false;
  }
}

// ===== Setup-Aktionen =====
async function loadClubs() {
  try {
    state.clubs = await fetchClubs();
    save(); renderSetup();
  } catch (err) { alert("Clubs laden fehlgeschlagen: " + errMsg(err)); }
}

async function rankParticipants() {
  if (!state.participants.length) return;
  try {
    const ccIds = state.participants.map(p => p.cc_id).filter(x => x != null);
    const data = await fetchPlayerRankings({ discipline: state.discipline, playerCcIds: ccIds });
    const byCc = {};
    (data.players || []).forEach(r => { byCc[String(r.cc_id)] = r; });
    const ranked = [], unranked = [];
    for (const p of state.participants) {
      const r = byCc[String(p.cc_id)];
      if (r) { ranked.push({ ...p, rank: r.rank ?? null, gd: r.gd ?? null }); }
      else { unranked.push({ ...p, rank: null, gd: null }); }
    }
    ranked.sort((a, b) => {
      if (a.rank != null && b.rank != null) return a.rank - b.rank;
      if (a.gd != null && b.gd != null) return b.gd - a.gd;
      return 0;
    });
    state.participants = [...ranked, ...unranked];
    reseed(); save(); renderSetup();
  } catch (err) {
    alert("Ranking konnte nicht geladen werden: " + errMsg(err) + "\n\nFalls der Endpoint noch nicht deployt ist, kannst du die Reihenfolge manuell setzen.");
  }
}

async function loadTables() {
  const raw = state.locationInput.trim();
  if (!raw) { alert("Bitte Location-id oder cc_id eingeben."); return; }
  try {
    let doc;
    try { doc = await fetchTables({ id: raw }); }
    catch (e1) { doc = await fetchTables({ cc_id: raw }); }
    state.availableTables = doc.tables || [];
    state.location = doc.location || { id: /^\d+$/.test(raw) ? +raw : null, cc_id: null };
    save(); renderSetup();
  } catch (err) { alert("Tische laden fehlgeschlagen: " + errMsg(err)); }
}

function addManualTable() {
  const name = prompt("Tisch-Name (genau wie in Carambus, z. B. Tisch 5):");
  if (!name) return;
  const n = name.trim();
  if (!state.availableTables.some(t => t.name === n)) state.availableTables.push({ name: n });
  if (!state.tables.includes(n)) state.tables.push(n);
  save(); renderSetup();
}

async function startTournament() {
  const n = state.participants.length;
  const plan = curPlan();
  if (!plan) { alert("Kein KO-Plan gewählt."); return; }
  if (n < 2 || n > plan.size) { alert(`Teilnehmerzahl muss zwischen 2 und ${plan.size} liegen (Plan „${plan.id}").`); return; }
  if (!state.tables.length) { alert("Mindestens einen Tisch wählen."); return; }

  if (isLive()) {
    try {
      const ext = tournamentExternalId();
      const loc = state.location;
      if (!loc || (loc.id == null && loc.cc_id == null)) { alert("Live-Modus: Location aus Carambus laden (Tische)."); return; }
      const t = await createTournament({ externalId: ext, title: `${plan.type} ${state.discipline}`, location: loc, discipline: state.discipline });
      state.carambusTournament = { id: t.id ?? null, external_id: t.external_id || ext, tournament_monitor_id: t.tournament_monitor_id ?? null };
      const fails = [];
      for (const name of state.tables) {
        try { await lockTable({ externalId: state.carambusTournament.external_id, tableName: name, tableId: tableIdOf(name) }); }
        catch (e) { fails.push(`${name}: ${errMsg(e)}`); }
      }
      if (fails.length) {
        if (!confirm("Einige Tische konnten nicht gebunden werden:\n" + fails.join("\n") + "\n\nTrotzdem fortfahren?")) return;
      }
    } catch (err) { alert("Turnier anlegen fehlgeschlagen: " + errMsg(err)); return; }
  }

  run = KO.buildRun(plan, state.participants.map((p, i) => ({ ...p, seed: i + 1 })), { shuffle });
  state.phase = "running";
  save(); renderAll();
  switchTab("games");
}

async function resetTournament() {
  const live = isLive();
  if (!confirm("Turnier verwerfen? Das Bracket und alle erfassten Ergebnisse gehen verloren (Setup bleibt)." + (live ? "\nLive: Turnier + Spiele werden in Carambus abgeräumt (Tische frei)." : ""))) return;
  if (live) {
    const ext = state.carambusTournament?.external_id || tournamentExternalId();
    try {
      const body = await endTournament({ externalId: ext, cleanup: true });
      if (!body.tournament_deleted) console.warn("Abbruch: Carambus hat das Turnier nicht gelöscht", body);
    } catch (e) {
      if (!confirm("Carambus-Abräumen fehlgeschlagen: " + errMsg(e) + "\n\nTrotzdem lokal verwerfen?")) return;
    }
  }
  run = null;
  state.phase = "setup";
  state.carambusTournament = null;
  save(); renderAll();
  switchTab("setup");
}

// ===== SPIELE & BRACKET =====
function renderGames() {
  const el = document.getElementById("tab-games");
  if (!run) { el.innerHTML = `<div class="card"><p class="muted">Noch kein Bracket — erst im Setup anlegen.</p></div>`; return; }

  const pr = runProgress(run);
  const ready = KO.readyMatches(run);
  const running = KO.runningMatches(run);
  const freeTables = freeTableList();
  const champion = championOf(run);
  const resetM = activeResetMatch(run);

  el.innerHTML = `
    <div class="card">
      <h2>Tische</h2>
      <div class="tables-bar">${renderTablesBar()}</div>
      <div class="toolbar">
        <button class="btn" id="btnFillTables" ${ready.length && freeTables.length ? "" : "disabled"}>▶ Freie Tische mit nächsten Spielen belegen</button>
        ${isLive() && running.length ? `<button class="btn secondary" id="btnPollAll">📥 Ergebnisse laufender Spiele holen</button>` : ``}
        <span class="muted">${pr.done}/${pr.total} Spiele · ${ready.length} spielbereit · ${running.length} laufend</span>
      </div>
      ${resetM ? `<div class="alert">🔄 <strong>Entscheidungsspiel (Bracket-Reset):</strong> ${escapeHtml(roundLabel(resetM))} — der Sieger der Verliererrunde hat das erste Finale gewonnen; jetzt haben <strong>beide eine Niederlage</strong>. Dieses Spiel bestimmt den Turniersieger.</div>` : ``}
      ${champion ? `<div class="info">🏆 Turniersieger: <strong>${escapeHtml(fullName(champion))}</strong> — siehe Endstand.</div>` : ``}
    </div>

    <div class="card">
      <h2>Spielbereit (${ready.length})</h2>
      ${ready.length ? `<div class="matches-grid">${ready.map(m => matchCard(m, "ready", freeTables)).join("")}</div>` : `<p class="muted">Aktuell kein Spiel spielbereit.</p>`}
    </div>

    <div class="card">
      <h2>Laufend (${running.length})</h2>
      ${running.length ? `<div class="matches-grid">${running.map(m => matchCard(m, "running", freeTables)).join("")}</div>` : `<p class="muted">Kein laufendes Spiel.</p>`}
    </div>

    <div class="card">
      <h2>Bracket-Übersicht</h2>
      <div class="bracket-cols">${renderBracketColumns()}</div>
    </div>`;

  bindGameActions(el);
}

function renderTablesBar() {
  return state.tables.map(name => {
    const m = [...run.matches.values()].find(x => x.table === name && x.status === "running");
    const cls = m ? "busy" : "free";
    const who = m ? `${shortName(m.a)} vs ${shortName(m.b)}` : "frei";
    return `<div class="table-chip ${cls}"><div class="tname">${escapeHtml(name)}</div><div class="who">${escapeHtml(who)}</div></div>`;
  }).join("");
}

function matchCard(m, mode, freeTables) {
  const tblOpts = freeTables.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
  let actions = "";
  if (mode === "ready") {
    actions = freeTables.length
      ? `<select class="m-table" data-id="${m.nr}">${tblOpts}</select>
         <button class="btn m-start" data-id="${m.nr}">▶ Starten</button>`
      : `<span class="muted">kein freier Tisch</span>`;
  } else if (mode === "running") {
    actions = `${isLive() ? `<button class="btn m-poll" data-id="${m.nr}">📥 Ergebnis holen</button>` : ``}
               <button class="btn secondary m-manual" data-id="${m.nr}">✎ Ergebnis erfassen</button>`;
  }
  return `<div class="m-card ${mode}">
      <div class="m-top"><span>${escapeHtml(roundLabel(m))}</span><span class="m-id">P${m.nr}${m.table ? " · " + escapeHtml(m.table) : ""}</span></div>
      ${slotLine(m, "a")}
      ${slotLine(m, "b")}
      <div class="m-actions">${actions}</div>
      <div class="m-manual-box" id="manual-${m.nr}"></div>
    </div>`;
}

function slotLine(m, slot) {
  const p = m[slot];
  const res = m.result?.[slot];
  let cls = "pn";
  if (m.status === "done" || m.status === "bye") cls += (m.winner === p ? " win" : " lose");
  if (isBye(p)) cls += " bye";
  const name = isBye(p) ? "Freilos" : (isPlayer(p) ? fullName(p) : srcLabel(m, slot));
  const score = res ? `${res.balls ?? "-"}${res.innings ? " / " + res.innings : ""}` : "";
  return `<div class="m-slot"><span class="${cls}">${escapeHtml(name)}</span><span class="sc">${escapeHtml(score)}</span></div>`;
}

function srcLabel(m, slot) {
  const ref = slot === "a" ? m.aRef : m.bRef;
  if (!ref) return "—";
  if (ref.seed != null) return `Setzplatz ${ref.seed}`;
  if (ref.winnerOf != null) return `Sieger P${ref.winnerOf}`;
  if (ref.loserOf != null) return `Verlierer P${ref.loserOf}`;
  if (ref.lot) return "Auslosung";
  return "—";
}

function renderBracketColumns() {
  const groups = []; const idx = new Map();
  for (const nr of run.order) {
    const m = run.matches.get(nr);
    if (!m || m.status === "skipped") continue;
    const key = m.round || "?";
    if (!idx.has(key)) { idx.set(key, groups.length); groups.push({ label: key, matches: [] }); }
    groups[idx.get(key)].matches.push(m);
  }
  return groups.map(g => `
    <div class="bracket-col">
      <h4>${escapeHtml(g.label)}</h4>
      ${g.matches.map(m => `
        <div class="m-card ${m.status}">
          <div class="m-top"><span class="m-id">P${m.nr}</span><span class="badge ${statusBadge(m.status)}">${statusText(m.status)}</span></div>
          ${slotLine(m, "a")}
          ${slotLine(m, "b")}
        </div>`).join("")}
    </div>`).join("");
}

function statusBadge(s) { return s === "done" ? "done" : s === "running" ? "running" : s === "ready" ? "open" : ""; }
function statusText(s) { return { pending: "wartet", waiting: "wartet", ready: "bereit", running: "läuft", done: "fertig", bye: "Freilos", skipped: "" }[s] || s; }

function bindGameActions(el) {
  el.querySelector("#btnFillTables")?.addEventListener("click", fillFreeTables);
  el.querySelector("#btnPollAll")?.addEventListener("click", pollAllRunning);
  el.querySelectorAll(".m-start").forEach(b => b.addEventListener("click", () => {
    const nr = +b.dataset.id;
    const sel = el.querySelector(`.m-table[data-id="${nr}"]`);
    startMatch(run.matches.get(nr), sel?.value);
  }));
  el.querySelectorAll(".m-poll").forEach(b => b.addEventListener("click", () => pollMatch(run.matches.get(+b.dataset.id))));
  el.querySelectorAll(".m-manual").forEach(b => b.addEventListener("click", () => openManual(run.matches.get(+b.dataset.id))));
}

function freeTableList() {
  const busy = new Set([...run.matches.values()].filter(m => m.status === "running" && m.table).map(m => m.table));
  return state.tables.filter(n => !busy.has(n)).sort((a, b) => (tableNo(a) ?? 0) - (tableNo(b) ?? 0));
}
// Carambus-Table-id zum Tischnamen (aus den geladenen Tischen). Wird bevorzugt an
// lock_table/start_game gesendet → robust gegen doppelte Tischnamen einer Location.
function tableIdOf(name) { const t = (state.availableTables || []).find(x => x.name === name); return t && t.id != null ? t.id : null; }

async function startMatch(m, tableName) {
  if (!m || m.status !== "ready") return;
  if (!tableName) { alert("Kein Tisch gewählt/frei."); return; }
  // Doppelbelegung verhindern: kein zweites Spiel auf einem bereits laufenden Tisch.
  // (Carambus würde sonst das laufende Spiel am selben Tisch ersetzen.)
  const occupied = [...run.matches.values()].find(x => x !== m && x.status === "running" && x.table === tableName);
  if (occupied) { alert(`Tisch „${tableName}" ist bereits belegt: ${shortName(occupied.a)} vs ${shortName(occupied.b)}.\nBitte einen freien Tisch wählen.`); renderGames(); return; }
  // Tisch SOFORT reservieren (vor dem async start_game), damit ein schneller zweiter Klick
  // den Tisch nicht mehr als frei sieht (schließt die Race-Lücke).
  m.external_id = gameExternalId(m.nr);
  m.table = tableName; m.status = "running";
  renderGames();
  if (isLive()) {
    try {
      // Spielform + Distanz/Sätze je nach Disziplin (Karambol vs Pool vs Snooker).
      const gf = gameFormat();
      const participants = [
        { role: "playera", player: cleanPlayerRef(m.a), discipline: state.discipline, balls_goal: gf.balls_goal },
        { role: "playerb", player: cleanPlayerRef(m.b), discipline: state.discipline, balls_goal: gf.balls_goal }
      ];
      const res = await startGame({
        externalId: state.carambusTournament.external_id,
        gameExternalId: m.external_id, tableName, tableId: tableIdOf(tableName), participants,
        format: { free_game_form: gf.free_game_form, innings_goal: gf.innings_goal, sets_to_play: gf.sets_to_play, sets_to_win: gf.sets_to_win, allow_follow_up: gf.allow_follow_up, initial_red_balls: gf.initial_red_balls }
      });
      m.cbState = res.state || "warmup";
    } catch (err) {
      m.status = "ready"; m.table = null; renderGames(); // Reservierung zurücknehmen
      alert("Spiel starten fehlgeschlagen: " + errMsg(err)); return;
    }
  }
  save(); renderGames();
}

async function fillFreeTables() {
  let free = freeTableList();
  const ready = KO.readyMatches(run);
  for (const m of ready) {
    if (!free.length) break;
    const t = free.shift();
    await startMatch(m, t);
    free = freeTableList();
  }
}

async function pollMatch(m) {
  if (!m || m.status !== "running") return;
  try {
    const { status, body } = await acknowledgeResult({ externalId: state.carambusTournament.external_id, gameExternalId: m.external_id });
    if (status === 409) { alert("Ergebnis noch nicht erfasst (Spiel läuft am Scoreboard)."); return; }
    const result = mapAckResult(body.result);
    completeMatch(m, result);
  } catch (err) {
    if (err instanceof CarambusError && err.status === 409) { alert("Ergebnis noch nicht erfasst (Spiel läuft)."); return; }
    alert("Ergebnis holen fehlgeschlagen: " + errMsg(err));
  }
}

async function pollAllRunning() {
  for (const m of KO.runningMatches(run)) {
    try {
      const { status, body } = await acknowledgeResult({ externalId: state.carambusTournament.external_id, gameExternalId: m.external_id });
      if (status === 409) continue;
      completeMatch(m, mapAckResult(body.result));
    } catch (e) { /* 409 / läuft noch → überspringen */ }
  }
  renderGames();
}

function mapAckResult(result) {
  if (!result) return null;
  const num = v => (v == null ? null : (typeof v === "number" ? v : parseInt(v, 10)));
  return {
    a: { balls: num(result.Ergebnis1), innings: num(result.Aufnahmen1), hs: num(result["Höchstserie1"] ?? result.Hoechstserie1) },
    b: { balls: num(result.Ergebnis2), innings: num(result.Aufnahmen2), hs: num(result["Höchstserie2"] ?? result.Hoechstserie2) }
  };
}

function completeMatch(m, result) {
  let winnerSlot = KO.winnerFromResult(result);
  if (!winnerSlot) {
    const pick = prompt(`Kein eindeutiger Sieger aus dem Ergebnis.\nSieger wählen: "a" = ${shortName(m.a)}, "b" = ${shortName(m.b)}`);
    if (pick !== "a" && pick !== "b") return;
    winnerSlot = pick;
  }
  m.tablePlayed = m.table;       // Tisch sichern, bevor er freigegeben wird (für „Alle Spiele")
  KO.recordMatch(run, m.nr, winnerSlot, result); // setzt at, Status done, autoResolve (Folgepartien/Auslosung)
  m.table = null;
  if (KO.isFinished(run)) state.phase = "finished";
  save(); renderAll();
  // Nach jedem Match ins Archiv — idempotent, und ein Geraeteverlust mittendrin
  // kostet dann nichts. Bewusst ohne await: das naechste Spiel soll nicht warten.
  if (isLive()) pushArchive({ silent: true });
}

function openManual(m) {
  const box = document.getElementById("manual-" + m.nr);
  if (!box) return;
  if (box.dataset.open === "1") { box.innerHTML = ""; box.dataset.open = "0"; return; }
  box.dataset.open = "1";
  box.innerHTML = `
    <div class="res-inputs"><span class="lbl">Spieler</span><span class="lbl">Bälle</span><span class="lbl">Aufn.</span><span class="lbl">HS</span></div>
    <div class="res-inputs">
      <span>${escapeHtml(shortName(m.a))}</span>
      <input type="number" id="ra-balls-${m.nr}"><input type="number" id="ra-inn-${m.nr}"><input type="number" id="ra-hs-${m.nr}">
    </div>
    <div class="res-inputs">
      <span>${escapeHtml(shortName(m.b))}</span>
      <input type="number" id="rb-balls-${m.nr}"><input type="number" id="rb-inn-${m.nr}"><input type="number" id="rb-hs-${m.nr}">
    </div>
    <div class="m-actions"><button class="btn" id="save-${m.nr}">✓ Ergebnis speichern</button></div>`;
  const first = document.getElementById(`ra-balls-${m.nr}`);
  if (first) first.focus();
  document.getElementById("save-" + m.nr).addEventListener("click", () => {
    const v = id => { const x = document.getElementById(id)?.value; return x === "" || x == null ? null : parseInt(x, 10); };
    const result = {
      a: { balls: v(`ra-balls-${m.nr}`), innings: v(`ra-inn-${m.nr}`), hs: v(`ra-hs-${m.nr}`) },
      b: { balls: v(`rb-balls-${m.nr}`), innings: v(`rb-inn-${m.nr}`), hs: v(`rb-hs-${m.nr}`) }
    };
    if (result.a.balls == null || result.b.balls == null) { alert("Bitte beide Ball-Ergebnisse eingeben."); return; }
    completeMatch(m, result);
  });
}

// ===== ENDSTAND =====
function renderStandings() {
  const el = document.getElementById("tab-standings");
  if (!run) { el.innerHTML = `<div class="card"><p class="muted">Noch kein Turnier.</p></div>`; return; }
  const pl = KO.placements(run);
  const champion = championOf(run);

  el.innerHTML = `
    <div class="card">
      <h2>Endplatzierung</h2>
      ${champion ? "" : `<div class="alert">Turnier läuft noch — finale Platzierung erst nach dem Finale.</div>`}
      <table class="standings-table">
        <thead><tr><th>Platz</th><th style="text-align:left">Spieler</th><th>Verein</th></tr></thead>
        <tbody>${pl.map(p => `<tr class="${p.place === 1 ? "gold" : ""}"><td class="place">${p.place}</td><td style="text-align:left">${escapeHtml(fullName(p.player))}</td><td>${escapeHtml(p.player.club_shortname || "")}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">—</td></tr>`}</tbody>
      </table>
    </div>
    ${renderAllGamesList()}
    <div class="card"><h2>Export</h2>
      <div class="toolbar">
        <button class="btn" id="btnCsv">📄 Spiele-CSV</button>
        <button class="btn" id="btnRanking">📄 Rangliste (ClubCloud)</button>
        ${isLive() ? `<button class="btn secondary" id="btnArchive">📦 Ergebnisse in Carambus ablegen</button><button class="btn danger" id="btnEnd">🧹 Turnier in Carambus abräumen (Tische frei + löschen)</button>` : ``}
      </div>
      ${archiveStatusHtml()}
      <div class="muted" style="font-size:12px;margin-top:6px;">Endstand und Partien stehen jetzt auch in Carambus auf der Turnierseite — abgelegt wird nach jedem Spiel automatisch, der Knopf ist für den Nachschub von Hand. <strong>„Abräumen" löscht auch dieses Archiv</strong>; danach ist die App wieder die einzige Quelle — vorher CSV sichern.</div>
    </div>`;

  el.querySelector("#btnCsv")?.addEventListener("click", exportCsv);
  el.querySelector("#btnRanking")?.addEventListener("click", exportRanking);
  el.querySelector("#btnArchive")?.addEventListener("click", () => pushArchive());
  el.querySelector("#btnEnd")?.addEventListener("click", endCarambusTournament);
  el.querySelector("#btnPrintGames")?.addEventListener("click", () => window.print());
}

// Spiele-CSV im Carambus-Import-Format (gemeinsamer Baustein). Nur echte Paarungen (keine Freilose),
// in Plan-Reihenfolge. Spielname = Runde + Partie-Nr.
function exportCsv() {
  const games = KO.playedGames(run).filter(m => m.result).map(m => {
    const ra = m.result.a || {}, rb = m.result.b || {};
    return { name: gameName(m), dbuA: m.a.dbu_nr ?? "", dbuB: m.b.dbu_nr ?? "",
      ballsA: ra.balls ?? "", ballsB: rb.balls ?? "", inningsA: ra.innings ?? "", inningsB: rb.innings ?? "",
      hsA: ra.hs ?? "", hsB: rb.hs ?? "", at: m.at };
  });
  downloadText(`spiele-${disciplineSlug()}-${new Date().toISOString().slice(0, 10)}.csv`, Carambus.util.buildGamesCsv(games));
}
// ClubCloud-Rangliste (gemeinsamer Baustein): RANG;PUNKTE;GRUPPENRANG;PASS-NR;PGA;VEREINSNR;TEILNEHMER
// PASS-NR = Spieler-cc_id, VEREINSNR = Club-cc_id, TEILNEHMER = „Nachname, Vorname". KO hat keine Gruppen.
function exportRanking() {
  const rows = KO.placements(run).map(e => {
    const p = e.player;
    const teil = `${p.lastname || p.l || ""}, ${p.firstname || p.f || ""}`.replace(/^,\s*|,\s*$/g, "").trim() || fullName(p);
    return { rang: e.place, punkte: "", gruppenrang: "", passNr: p.cc_id ?? "", pga: "", vereinsNr: p.club_cc_id ?? "", teilnehmer: teil };
  });
  downloadText(`rangliste-${disciplineSlug()}-${new Date().toISOString().slice(0, 10)}.csv`, Carambus.util.buildRankingCsv(rows));
}
// Liste aller Spiele (wie in plan/3band) — nummeriert in Plan-Reihenfolge, Sieger hervorgehoben.
function renderAllGamesList() {
  if (!run) return "";
  const gd = (b, i) => (b != null && i > 0 ? (b / i).toFixed(2) : "—");
  const num = v => (v == null ? "—" : v);
  const games = run.order.map(nr => run.matches.get(nr)).filter(m => m && isPlayer(m.a) && isPlayer(m.b));
  const nameCell = (p, isWin) => `<td style="text-align:left;${isWin ? "color:var(--good);font-weight:600;" : ""}">${p ? escapeHtml(fullName(p)) : `<span class="muted">—</span>`}</td>`;
  const rows = games.map((m, i) => {
    const r = m.result, done = m.status === "done", ra = r?.a || {}, rb = r?.b || {};
    return `<tr>
      <td style="text-align:center;color:var(--muted);">${i + 1}</td>
      <td style="text-align:left;white-space:nowrap;">${escapeHtml(gameName(m))}</td>
      <td style="text-align:center;">${m.tablePlayed != null ? escapeHtml(String(m.tablePlayed)) : "—"}</td>
      ${nameCell(m.a, done && m.winner === m.a)}
      <td style="text-align:right;">${num(ra.balls)}</td><td style="text-align:right;">${num(ra.innings)}</td><td style="text-align:right;">${num(ra.hs)}</td><td style="text-align:right;font-family:monospace;color:var(--muted);">${gd(ra.balls, ra.innings)}</td>
      <td style="text-align:center;font-family:monospace;">${done ? `${num(ra.balls)}:${num(rb.balls)}` : "—"}</td>
      <td style="text-align:right;">${num(rb.balls)}</td><td style="text-align:right;">${num(rb.innings)}</td><td style="text-align:right;">${num(rb.hs)}</td><td style="text-align:right;font-family:monospace;color:var(--muted);">${gd(rb.balls, rb.innings)}</td>
      ${nameCell(m.b, done && m.winner === m.b)}
    </tr>`;
  }).join("");
  return `<div class="card"><h2>Alle Spiele</h2>
    <div class="toolbar"><button class="btn secondary" id="btnPrintGames">🖨 Drucken</button></div>
    <div style="overflow-x:auto;"><table class="standings-table" style="font-size:12px;white-space:nowrap;">
      <thead><tr><th>#</th><th style="text-align:left;">Spiel</th><th>Tisch</th><th style="text-align:left;">Spieler A</th><th>Bälle</th><th>Aufn.</th><th>HS</th><th>GD</th><th>Erg.</th><th>Bälle</th><th>Aufn.</th><th>HS</th><th>GD</th><th style="text-align:left;">Spieler B</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

// ===== Ergebnisarchiv =====================================================
// Endstand + Partien als lesbare Kopie auf dem lokalen Server. Vertrag und
// Anzeige-Zwaenge: HANDOFF-to-/from-carambus-tournament-result-archive.md; die
// Normalisierung der Zeilen macht der gemeinsame Kern.
function archiveName(p) { return `${p.lastname || p.l || ""}, ${p.firstname || p.f || ""}`.replace(/^,\s*|,\s*$/g, "").trim() || fullName(p); }
function archiveTotals() {
  const acc = new Map();
  const ensure = p => { const id = KO.pid(p); if (!acc.has(id)) acc.set(id, { games: 0, wins: 0, balls: 0, innings: 0, hs: 0 }); return acc.get(id); };
  KO.playedGames(run).filter(m => m.result).forEach(m => {
    const A = ensure(m.a), B = ensure(m.b), ra = m.result.a || {}, rb = m.result.b || {};
    A.games++; B.games++;
    if (m.winner && KO.pid(m.winner) === KO.pid(m.a)) A.wins++; else if (m.winner && KO.pid(m.winner) === KO.pid(m.b)) B.wins++;
    A.balls += ra.balls || 0; A.innings += ra.innings || 0; if ((ra.hs || 0) > A.hs) A.hs = ra.hs;
    B.balls += rb.balls || 0; B.innings += rb.innings || 0; if ((rb.hs || 0) > B.hs) B.hs = rb.hs;
  });
  return acc;
}
function archiveStandings() {
  const tot = archiveTotals();
  return Carambus.util.buildResultStandings(KO.placements(run).map(e => {
    const p = e.player, s = tot.get(KO.pid(p)) || { games: 0, wins: 0, balls: 0, innings: 0, hs: 0 };
    return {
      player: Carambus.api.cleanPlayerRef(p),
      rank: e.place,
      columns: {
        "Rang": e.place, "Name": archiveName(p), "Land": p.nationality || "", "Verein": p.club_shortname || "",
        "Sp": s.games, "S": s.wins, "Baelle": s.balls, "Aufn.": s.innings,
        "GD": s.innings > 0 ? (s.balls / s.innings).toFixed(3).replace(".", ",") : "", "HS": s.hs || ""
      }
    };
  }));
}
function archiveGames() {
  const played = KO.playedGames(run).filter(m => m.result).slice().sort((a, b) => (a.nr || 0) - (b.nr || 0));
  return Carambus.util.buildResultGames(played.map((m, i) => {
    const ra = m.result.a || {}, rb = m.result.b || {};
    const gd2 = (bl, inn) => (inn > 0 ? (bl / inn).toFixed(2).replace(".", ",") : "");
    return {
      gname: "P" + m.nr, seqno: m.nr ?? i + 1,
      group_no: null, round_no: null,
      table_no: Carambus.util.tableNo(m.tablePlayed ?? m.table),
      ended_at: m.at ? new Date(m.at).toISOString() : null,
      columns: {
        "Partie": i + 1, "Spiel": gameName(m), "Tisch": (m.tablePlayed ?? m.table) ?? "",
        "Spieler A": m.a ? archiveName(m.a) : "",
        "Baelle A": ra.balls ?? "", "Aufn. A": ra.innings ?? "", "HS A": ra.hs ?? "", "GD A": gd2(ra.balls, ra.innings),
        "Ergebnis": `${ra.balls ?? "-"}:${rb.balls ?? "-"}`,
        "Spieler B": m.b ? archiveName(m.b) : "",
        "Baelle B": rb.balls ?? "", "Aufn. B": rb.innings ?? "", "HS B": rb.hs ?? "", "GD B": gd2(rb.balls, rb.innings)
      }
    };
  }));
}
function archiveMessage(b) {
  const head = `${b.seedings_written ?? 0} Zeilen Endstand, ${b.games_written ?? 0} Partien.`;
  const un = (b.players_unmatched || []).length;
  const unTxt = un ? `\n\n${un} Spieler(in) ohne Carambus-Zuordnung — die Zeilen stehen trotzdem im Endstand.` : "";
  return b.durable ? `✅ Archiviert.\n\n${head}${unTxt}`
                   : `💾 Gespeichert — noch nicht dauerhaft.\n\n${head}${unTxt}\n\nDer Server raeumt App-Turniere nachts noch ab. Bis Carambus das abstellt, schuetzt nur ein end_date in der Zukunft.`;
}
function archiveStatusHtml() {
  const a = state.archive; if (!a) return "";
  const when = new Date(a.at).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
  if (a.error) return `<div class="muted" style="font-size:12px;margin-top:6px;color:var(--bad);">Letzter Archiv-Versuch ${when} fehlgeschlagen: ${escapeHtml(a.error)}</div>`;
  return `<div class="muted" style="font-size:12px;margin-top:6px;">${a.durable ? "✅ Archiviert" : "💾 Gespeichert, noch nicht dauerhaft"} — ${when}, ${a.seedings ?? 0} Zeilen / ${a.games ?? 0} Partien${a.unmatched ? `, ${a.unmatched} ohne Zuordnung` : ""}.</div>`;
}
async function pushArchive({ silent = false } = {}) {
  if (!isLive()) { if (!silent) alert("Nicht mit Carambus verbunden — Archivieren geht nur im Live-Modus."); return; }
  if (!run) return;
  try {
    const body = await Carambus.api.pushTournamentResult({
      externalId: state.carambusTournament?.external_id || tournamentExternalId(),
      scheme: "doppelko", title: "Endstand",
      standings: archiveStandings(), games: archiveGames()
    });
    state.archive = { at: Date.now(), durable: !!body.durable, seedings: body.seedings_written, games: body.games_written, unmatched: (body.players_unmatched || []).length };
    save();
    if (!silent) { alert(archiveMessage(body)); renderAll(); }
  } catch (e) {
    state.archive = { at: Date.now(), error: errMsg(e) }; save();
    if (!silent) alert("Archivieren fehlgeschlagen: " + errMsg(e));
    else console.warn("Auto-Archiv:", errMsg(e));
  }
}

async function endCarambusTournament() {
  const open = KO.runningMatches(run).length + KO.readyMatches(run).length;
  if (!confirm(`Turnier in Carambus ABRÄUMEN?${open ? `\n\nEs gibt noch ${open} offene/laufende Spiele — CSV vorher exportieren!` : ""}\n\nGibt alle Tische frei UND löscht Turnier + Spiele in Carambus${state.archive && !state.archive.error ? " — auch den bereits abgelegten Endstand" : ""}. Das App-Bracket bleibt erhalten.`)) return;
  const ext = state.carambusTournament?.external_id || tournamentExternalId();
  try {
    const body = await endTournament({ externalId: ext, cleanup: true });
    alert(`Abgeräumt: ${body.released_tables ?? 0} Tische frei` + (body.tournament_deleted ? `, Turnier gelöscht` : `, Turnier nicht gefunden/bereits weg`) + (body.games_deleted != null ? `, ${body.games_deleted} Spiele gelöscht` : ""));
  } catch (err) { alert("Abräumen fehlgeschlagen: " + errMsg(err)); }
}

// ===== Helfer =====
function fullName(p) { return p ? `${p.firstname || p.f || ""} ${p.lastname || p.l || ""}`.trim() || "?" : "?"; }
function shortName(p) { if (isBye(p)) return "Freilos"; if (!isPlayer(p)) return "—"; const f = (p.firstname || "").slice(0, 1); return `${f ? f + ". " : ""}${p.lastname || ""}`.trim() || fullName(p); }
function sameP(a, b) { if (a.cc_id != null && b.cc_id != null) return String(a.cc_id) === String(b.cc_id); return fullName(a) === fullName(b); }
function reseed() { state.participants = state.participants.map((p, i) => ({ ...p, seed: i + 1 })); }
function roundLabel(m) { return m.round || ("Partie " + m.nr); }
function gameName(m) { return `${roundLabel(m)} · P${m.nr}`; }
function errMsg(err) {
  if (err instanceof CarambusError) {
    const d = err.body != null ? " " + (typeof err.body === "string" ? err.body : JSON.stringify(err.body)) : "";
    return `HTTP ${err.status}${d}`;
  }
  return err?.message || String(err);
}
function switchTab(tab) {
  const btn = document.querySelector(`nav.tabs button[data-tab="${tab}"]`);
  if (btn) btn.click();
}

renderAll();
</script>
