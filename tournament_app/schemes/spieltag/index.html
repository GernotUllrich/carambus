// Phase 5 / HANDOFF-to-carambus-party-api §1: GET party. Bei Erfolg den State 1:1 aus
// der Carambus-Antwort befüllen und external_id für spätere Pushes (§2/§3) merken.
async function loadLiveParty() {
  const ccId = state.party_cc_id || getConnection().party_cc_id;
  if (!ccId) { alert("Keine Party-cc_id konfiguriert (Verbindungs-Modal oben rechts oder Chat-Deeplink)."); return; }
  const btn = document.getElementById("btnLoadLive");
  const prev = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = "… lädt"; }
  try {
    const body = await Carambus.api.fetchParty({ partyCcId: ccId });
    if (!body?.party || !body?.team_a || !body?.team_b || !body?.party_monitor) {
      throw new Error("Antwort unvollständig — Endpoint liefert nicht alle Pflichtfelder (party/team_a/team_b/party_monitor).");
    }
    state.party = body.party;
    // Roster muss Array sein (Render-Helfer iterieren ohne ?-Chains in Hot-Paths).
    state.team_a = { ...body.team_a, roster: Array.isArray(body.team_a.roster) ? body.team_a.roster : [] };
    state.team_b = { ...body.team_b, roster: Array.isArray(body.team_b.roster) ? body.team_b.roster : [] };
    // PartyMonitor-Defensiv-Normalisierung: eine frisch in Carambus angelegte Party hat
    // typischerweise NOCH KEINE assigned_*_ids / tables / table_ids — diese Felder fehlen
    // dann ganz im JSON. renderLineupHints/renderStartHints greifen aber direkt auf .length
    // zu (Hot Path, keine ?-Chains), daher hier Defaults setzen statt im Renderer.
    const pm = body.party_monitor;
    state.party_monitor = {
      match_points: pm.match_points || { win: 2, draw: 1, lost: 0 },
      minimum_players: pm.minimum_players ?? 4,
      maximum_players: pm.maximum_players ?? 8,
      current_round: pm.current_round || 1,
      assigned_players_a_ids: Array.isArray(pm.assigned_players_a_ids) ? pm.assigned_players_a_ids : [],
      assigned_players_b_ids: Array.isArray(pm.assigned_players_b_ids) ? pm.assigned_players_b_ids : [],
      tables: Array.isArray(pm.tables) ? pm.tables : [],
      table_ids: Array.isArray(pm.table_ids) ? pm.table_ids : [],
      rows: normalizePartyMonitorRows(Array.isArray(pm.rows) ? pm.rows : [], pm.current_round || 1),
      result: pm.result || null
    };
    state.games = {};
    state.carambusParty = {
      external_id: body.party.external_id || `party-${body.party.id}`,
      id: body.party.id || null,
      loaded_at: Date.now(),
      // Pauls 48-08/H: writable=false ⇒ globale Party auf Local-Server, Pushes werden vom
      // LocalProtector abgewiesen. Default true für ältere Server-Versionen (Abwärtskompat).
      writable: body.party.writable !== false
    };
    state.party_monitor_state = body.party_monitor?.state || null;   // AASM-State (z. B. "seeding_mode", "playing_round", "closed")
    state.party_close = null;
    // Tische: wenn party_monitor.tables leer ist (frische Party, noch keine Runden-Zuordnung),
    // hole die Location-Tische und stelle sie für alle Runden zur Verfügung. Das Mapping
    // Runde→Tische-Untermenge entsteht erst, wenn der TL im Spieltag-Tab pro Spielzeile
    // einen Tisch wählt. tableMeta merkt sich die Carambus-Table#id pro Name (für id-first-
    // Bindung wie bei plan/doppelko/3band).
    state.tableMeta = state.tableMeta || {};
    const needsTables = !state.party_monitor.tables.length
      || !state.party_monitor.tables.some(arr => Array.isArray(arr) && arr.length);
    if (needsTables && body.party.location) {
      try {
        const locRef = body.party.location.id != null ? { id: body.party.location.id } : { cc_id: body.party.location.cc_id };
        const tBody = await Carambus.api.fetchTables(locRef);
        const names = (tBody.tables || []).map(t => t.name).filter(Boolean);
        (tBody.tables || []).forEach(t => { if (t.name && t.id != null) state.tableMeta[t.name] = t.id; });
        const nRounds = Math.max(1, rounds().length || 1);
        state.party_monitor.tables = Array.from({ length: nRounds }, () => names.slice());
      } catch (e) {
        console.warn("Tische konnten nicht geladen werden:", e?.message || e);
      }
    }
    save(); renderAll();
  } catch (err) {
    const status = err instanceof Carambus.CarambusError ? err.status : 0;
    const serverBody = err?.body;
    const serverError = (serverBody && typeof serverBody === "object") ? (serverBody.error || JSON.stringify(serverBody)) : (typeof serverBody === "string" ? serverBody : null);
    // 404 hat in Pauls Action drei Bedeutungen: a) Route fehlt (Endpoint nicht deployt),
    // b) Region nicht gefunden, c) Party nicht gefunden. Server-Body unterscheidet sie.
    let msg;
    if (status === 404 && serverError) msg = `404 vom Server: ${serverError} (Region/party_cc_id prüfen — kann die DB diesen Spieltag finden?)`;
    else if (status === 404) msg = "404 ohne Body — Endpoint /api/external_tournament/party evtl. noch nicht deployt (HANDOFF-to-carambus-party-api §1).";
    else if (status === 401) msg = "401 nicht autorisiert — Bearer-Token abgelaufen, bitte neu einloggen.";
    else if (status === 422) msg = `422 vom Server: ${serverError || "Request-Schema fehlerhaft"}.`;
    else msg = `${err?.message || String(err)}${serverError ? " — Server: " + serverError : ""}`;
    alert("Live-Load fehlgeschlagen: " + msg);
  } finally {
    if (btn && prev) { btn.disabled = false; btn.textContent = prev; }
  }
}

// Modus ii Push pro Spielzeile (Direkteingabe). Asynchron, blockt die UI nicht; Ergebnis
// wird im state.games[gname].sync gespeichert (status: pending/synced/error + last_error).
async function pushGameResult(row) {
  if (!isLive() || !state.carambusParty?.external_id) return;
  const g = state.games[gnameOf(row)];
  if (!g || !g.ended_at) return;
  // 48-08/H: präventiver Lock — Server würde 422 antworten, wir sparen den Roundtrip.
  if (!isWritable()) {
    g.sync = { status: "error", at: Date.now(), error: "READ-ONLY: " + (readOnlyReason() || "Schreiben blockiert") };
    save(); renderPlay();
    return;
  }
  g.sync = { status: "pending", at: Date.now() };
  save(); renderPlay();
  try {
    const body = await Carambus.api.partyGameResult({
      partyExternalId: state.carambusParty.external_id,
      gname: gnameOf(row),
      baResults: g.ba_results
    });
    // False-positive-Schutz: Pauls Endpoint gibt auch dann ok:true zurück, wenn ein silent
    // ActiveRecord::Rollback im record_game_result! griff (typischer Fall: LocalProtector
    // blockt Schreibvorgänge auf globale Records, id<50M, auf Local-Servern wie pbv/bcw).
    // Der ehrliche Indikator ist game.ended_at — wenn null, ist nichts persistiert worden.
    const persisted = body?.game?.ended_at != null;
    if (persisted) {
      g.sync = { status: "synced", at: Date.now(), server_intermediate: body?.intermediate_result || null };
    } else {
      g.sync = {
        status: "error", at: Date.now(),
        error: "Server hat ok:true gemeldet, aber game.ended_at ist null — vermutlich LocalProtector (globale Party, kein Schreibrecht auf diesem Local-Server). Ergebnis ist NICHT persistiert."
      };
    }
  } catch (err) {
    g.sync = { status: "error", at: Date.now(), error: err?.message || String(err) };
  }
  save(); renderPlay();
}

// Modus ii Spielbericht abschließen (§3): POST party_close. 409 mit missing_gnames
// wird sauber angezeigt, damit der TL die fehlenden Zeilen nachpflegen kann.
async function pushPartyClose() {
  if (!isLive() || !state.carambusParty?.external_id) return;
  if (!isWritable()) {
    state.party_close = { status: "error", at: Date.now(), error: "READ-ONLY: " + (readOnlyReason() || "Schreiben blockiert") };
    save(); renderPlay();
    return;
  }
  state.party_close = { status: "pending", at: Date.now() };
  save(); renderPlay();
  try {
    const body = await Carambus.api.partyClose({ partyExternalId: state.carambusParty.external_id });
    // Analog pushGameResult: silent rollback (LocalProtector) liefert ok:true ohne dass
    // party.state tatsächlich auf "closed" wechselt. party.state ist der ehrliche Indikator.
    const persisted = body?.party?.state === "closed";
    if (persisted) {
      state.party_close = { status: "synced", at: Date.now(), result: body?.result || null, party_state: body.party.state };
    } else {
      state.party_close = {
        status: "error", at: Date.now(),
        error: "Server hat ok:true gemeldet, aber party.state ist nicht 'closed' — vermutlich LocalProtector (globale Party, kein Schreibrecht auf diesem Local-Server). Spielbericht NICHT in CC gelandet."
      };
    }
  } catch (err) {
    const missing = err?.body?.missing_gnames || null;
    state.party_close = {
      status: "error",
      at: Date.now(),
      error: err?.message || String(err),
      missing_gnames: missing
    };
  }
  save(); renderPlay();
}

function startParty() {
  state.phase = "playing"; save(); renderAll(); switchTab("play");
}

// Spielbericht-Banner: zeigt local "abgeschlossen" + ggf. Live-Push-Status (pending/synced/error).
// Bei 409 missing_gnames bekommt der TL eine konkrete Liste der fehlenden Spielzeilen.
function renderFinishedBanner() {
  const c = state.party_close;
  const reopen = `<a href="#" id="btnReopen">Wieder öffnen</a>`;
  if (!c) return `<div class="info">Spielbericht <strong>abgeschlossen</strong>. Tabelle ist final, weitere Eingaben bleiben blockiert. ${reopen}.</div>`;
  if (c.status === "pending") return `<div class="info">Spielbericht <strong>abgeschlossen</strong>. ⟳ Sende <code>party_close</code> an Carambus … ${reopen}.</div>`;
  if (c.status === "synced") {
    const r = c.result || {};
    return `<div class="info">✓ Spielbericht an Carambus übertragen (Party-State <code>${escapeHtml(c.party_state || "closed")}</code>${r.game_points ? `, Server-Ergebnis ${escapeHtml(r.game_points)} / ${escapeHtml(r.match_points || "")}` : ""}). ${reopen}.</div>`;
  }
  // error
  const missing = c.missing_gnames || [];
  const missingHtml = missing.length
    ? `<br><span class="muted">Fehlende Spielzeilen: ${missing.map(g => `<code>${escapeHtml(g)}</code>`).join(", ")} — bitte ergänzen und erneut abschließen.</span>`
    : "";
  return `<div class="alert">⚠ <code>party_close</code> fehlgeschlagen: ${escapeHtml(c.error || "")}.${missingHtml}<br><button class="btn secondary" id="btnRetryClose" style="margin-top:8px;">↻ Erneut versuchen</button> &nbsp; ${reopen}.</div>`;
}

// ===== Game-Row-Helfer =====
// Spec §4.1: 4er-Team = 4 Spieler, Doppel = 2, sonst Einzel = 1. Konvention "in row.type".
function expectedPlayers(row) {
  if (/4er\s*Team/i.test(row.type)) return 4;
  if (/Doppel/i.test(row.type)) return 2;
  return 1;
}
function isSetsDiscipline(row) { return (row.sets || 0) > 1; }
function is141(row) { return /14\/1e/.test(row.type); }
// row.type → Disziplin-Familie für korrekte Vokabel ("Spiele" bei Pool/Kegel,
// "Frames" bei Snooker, "Sätze" bei Karambol-Satz-Disziplinen).
function disciplineFamily(rowType) {
  const t = String(rowType || "").toLowerCase();
  if (/snooker/.test(t)) return "snooker";
  if (/pool|ball|14[\/.]1/.test(t)) return "pool";
  if (/kegel/.test(t)) return "kegel";
  return "karambol";
}
function gameUnitPlural(rowType) {
  const f = disciplineFamily(rowType);
  return f === "snooker" ? "Frames" : f === "karambol" ? "Sätze" : "Spiele";
}
function pointsUnitPlural(rowType) {
  const f = disciplineFamily(rowType);
  return f === "snooker" ? "Punkte" : f === "pool" ? "Bälle" : f === "kegel" ? "Kegel" : "Punkte";
}
// Pauls 48-08/F+G: rows[].sets_source / score_source — "sportordnung" (verlässlich) /
// "scraped_heuristic" (gescrapt, ggf. ungenau) / "default" (Fallback). Bei nicht-Sportordnung
// dezentes ⓘ-Icon hinter dem Wert anzeigen, Tooltip erklärt die Provenienz.
function sourceMarker(src) {
  if (!src || src === "sportordnung") return "";
  const tip = src === "scraped_heuristic"
    ? "Wert aus Carambus heuristisch ermittelt (Maximum-Ergebnis aus historischen Spielen) — bitte gegen die Sportordnung prüfen."
    : src === "default"
    ? "Wert ist ein Default-Fallback — sollte aus dem GamePlan (Sportordnung) gepflegt werden."
    : "Wert-Herkunft: " + String(src);
  return ` <span style="color:var(--muted);cursor:help;" title="${escapeHtml(tip)}">ⓘ</span>`;
}
// gname = "<seqno>-<type>" — eindeutiger Spiel-Schlüssel, so findet Carambus das Game (§4.1).
function gnameOf(row) { return `${row.seqno}-${row.type}`; }
function rowGame(row) { return state.games[gnameOf(row)] || null; }
function rowIsDone(row) { const g = rowGame(row); return !!(g && g.ended_at); }
function rowHasLineup(row) {
  const exp = expectedPlayers(row);
  const collect = v => exp === 1 ? (v != null ? [v] : []) : (Array.isArray(v) ? v.filter(x => x != null) : []);
  return collect(row.player_a).length === exp && collect(row.player_b).length === exp;
}
function rowStatus(row) {
  if (rowIsDone(row)) return "done";
  if (rowHasLineup(row) && row.table) return "ready";
  return "open";
}
// Player-Lookup ist ab jetzt über dbu_nr (kanonisch); ba_id-Fallback nur für Legacy-Daten.
function rosterById(side, id) {
  const team = side === "a" ? state.team_a : state.team_b;
  const s = String(id);
  return (team?.roster || []).find(p => playerId(p) === s) || null;
}
function assignedRoster(side) {
  // Spieler ohne dbu_nr werden gar nicht in den Pool genommen — renderLineupTeam blendet
  // die Checkbox aus, hier doppelt absichern (Setup-State könnte aus anderer Quelle stammen).
  const ids = new Set((side === "a" ? state.party_monitor.assigned_players_a_ids : state.party_monitor.assigned_players_b_ids).map(String));
  return (side === "a" ? state.team_a : state.team_b).roster.filter(p => playerId(p) != null && ids.has(playerId(p)));
}
// Carambus' party_monitor.rows liefert je Spielzeile manchmal KEIN r_no (nur die
// "Neue Runde"-Trenner haben es — die Spiele dazwischen erben implizit die Runde).
// Und player_a/_b kann der Platzhalter "TBD" sein statt eine echte Spieler-ID.
// Beim Load → in-place normalisieren, damit rowsOfRound/rowHasLineup/Picker damit klarkommen.
function sanitizePlayer(v) {
  if (v == null) return null;
  if (Array.isArray(v)) {
    const cleaned = v.map(sanitizePlayer).filter(x => x != null);
    return cleaned.length ? cleaned : null;
  }
  const s = String(v).trim();
  if (s === "" || /^tbd$/i.test(s)) return null;
  return s;
}
function normalizePartyMonitorRows(rows, currentRound) {
  let cur = currentRound || 1;
  return (rows || []).map(r => {
    if (!r) return r;
    if (r.type === "Neue Runde") { if (r.r_no != null) cur = r.r_no; return r; }
    const out = { ...r };
    if (out.r_no == null) out.r_no = cur;
    if (Object.hasOwn(out, "player_a")) out.player_a = sanitizePlayer(out.player_a);
    if (Object.hasOwn(out, "player_b")) out.player_b = sanitizePlayer(out.player_b);
    return out;
  });
}

// Spielzeile = row mit nicht-leerem seqno (String oder Number) UND nicht-Trenner-Typ.
// Carambus liefert in game_plan.data.rows neben den Spielen auch Trenner ("Neue Runde") und
// Aggregate ("Gesamtsumme", "Zwischensumme"), die KEIN Spiel sind und kein seqno haben →
// nicht als Spielzeile rendern, nicht in die Aggregation §4.4 ziehen.
// Robust gegen seqno als Number ODER String (Live-pbv liefert manchmal String).
function isGameRow(r) {
  if (!r || r.seqno == null || r.seqno === "") return false;
  if (!Number.isFinite(Number(r.seqno))) return false;
  if (r.type === "Neue Runde") return false;
  if (/^(Gesamt|Zwischen)summe$/i.test(String(r.type || ""))) return false;
  return true;
}
// row.score kann String ("Hauptrunde 80"), Number, Object ({balls:80,…}) oder null sein.
// Liefert eine kompakte Anzeige für die "Distanz X"-Zeile.
function scoreLabel(s) {
  if (s == null || s === "") return null;
  if (typeof s === "number") return String(s);
  if (typeof s === "string") { const m = s.match(/\d+/g); return m ? m[m.length - 1] : s; }
  if (typeof s === "object") {
    const candidate = s.balls ?? s.points ?? s.target ?? s.max ?? s.distance;
    if (candidate != null) return String(candidate);
    return JSON.stringify(s);     // Letzte Notbremse — sichtbar, nicht "[object Object]"
  }
  return String(s);
}
function rounds() {
  return [...new Set((state.party_monitor.rows || []).filter(r => r && r.r_no != null).map(r => r.r_no))].sort((a, b) => a - b);
}
function rowsOfRound(rNo) { return (state.party_monitor.rows || []).filter(r => isGameRow(r) && r.r_no === rNo); }
function tablesOfRound(rNo) { return (state.party_monitor.tables || [])[rNo - 1] || []; }

// ===== SPIELTAG-Tab — Phase 2 (Zuordnung) + Phase 3 (Direkteingabe) =====
function renderPlay() {
  const el = document.getElementById("tab-play");
  if (!state.party) { el.innerHTML = `<div class="card"><p class="muted">Noch kein Spieltag — erst im Setup laden.</p></div>`; return; }
  if (state.phase === "setup") { el.innerHTML = `<div class="card"><div class="info">Erst im Setup die Aufstellung bestätigen.</div></div>`; return; }

  const rs = rounds();
  const all = rs.flatMap(rowsOfRound);
  const allDone = all.length && all.every(rowIsDone);
  const inter = computeIntermediate();
  // Einmaliger Erklär-Banner für den Direkteingabe-Modus. Klick auf "Verstanden" merkt sich
  // die Bestätigung in state.ui.directHintAck — Banner kommt dann nicht mehr.
  const showDirectHint = state.mode === "direct" && state.phase === "playing" && !state.ui?.directHintAck;
  el.innerHTML = `
    <div class="card">
      <h2>Spieltag — ${escapeHtml(state.team_a.name)} vs ${escapeHtml(state.team_b.name)}</h2>
      ${showDirectHint ? `<div class="info" style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;">
        <div>💡 <strong>Direkteingabe</strong> — Ergebnisse einfach in die Felder tippen, sie werden pro Spiel automatisch gespeichert${isLive() ? " und live an Carambus übertragen" : ""}. Reihenfolge ist frei, kein "Runde starten" nötig. Tisch-Auswahl ist nur Dokumentation. Wenn <strong>alle Spiele erfasst</strong> sind, erscheint der "🏁 Spielbericht abschließen"-Button.</div>
        <button class="btn secondary" id="btnAckDirectHint" style="white-space:nowrap;">Verstanden</button>
      </div>` : ``}
      <div class="standings-result" style="margin-bottom:14px;">
        <div class="gp">${inter.playedCount ? `${inter.gameA}:${inter.gameB}` : "–:–"}</div>
        <div class="mp">${inter.playedCount ? `Mannschaftspunkte ${inter.mpA}:${inter.mpB}` : "noch keine Spiele erfasst"}</div>
        <div class="muted" style="font-size:12px;margin-top:4px;">${inter.playedCount}/${all.length} Spiele erfasst</div>
      </div>
      ${!isWritable() ? `<div class="alert" style="border-left-color:var(--bad);background:rgba(239,83,80,0.10);margin-bottom:10px;">📛 <strong>READ-ONLY</strong> — ${escapeHtml(readOnlyReason() || "")}</div>` : ``}
      ${allDone && state.phase !== "finished" && isWritable() ? `<div class="toolbar" style="margin-bottom:10px;"><button class="btn" id="btnFinishParty">🏁 Spielbericht abschließen</button></div>` : ``}
      ${state.phase === "finished" ? renderFinishedBanner() : ``}
      ${rs.map(r => renderRound(r)).join("")}
    </div>`;
  rs.forEach(bindRound);
  el.querySelector("#btnFinishParty")?.addEventListener("click", () => {
    if (!confirm("Spielbericht abschließen? Ergebnisse werden danach gesperrt (du kannst wieder öffnen).")) return;
    state.phase = "finished"; save(); renderAll();
    // Live-Push asynchron — Status erscheint im Spielbericht-Banner.
    if (isLive() && state.carambusParty?.external_id) pushPartyClose();
  });
  el.querySelector("#btnReopen")?.addEventListener("click", (e) => {
    e.preventDefault(); state.phase = "playing"; state.party_close = null; save(); renderAll();
  });
  el.querySelector("#btnRetryClose")?.addEventListener("click", () => pushPartyClose());
  el.querySelector("#btnAckDirectHint")?.addEventListener("click", () => {
    state.ui = state.ui || {};
    state.ui.directHintAck = true;
    save(); renderPlay();
  });
}

function renderRound(rNo) {
  const games = rowsOfRound(rNo);
  const tables = tablesOfRound(rNo);
  const dupHints = collectDuplicates(rNo);
  return `
    <h3 style="margin-top:18px;color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border);padding-bottom:6px;">
      Runde ${rNo} <span class="muted" style="font-weight:normal;font-size:12px;">— ${games.filter(rowIsDone).length}/${games.length} erfasst</span>
    </h3>
    ${dupHints.length ? `<div class="dup-warn">⚠ ${dupHints.map(escapeHtml).join(" · ")}</div>` : ``}
    ${games.map(row => renderMatchRow(row, tables)).join("")}`;
}

function renderMatchRow(row, tables) {
  const status = rowStatus(row);
  const exp = expectedPlayers(row);
  const sets = isSetsDiscipline(row);
  const f141 = is141(row);
  const g = rowGame(row);
  const ba = g?.ba_results || {};
  const locked = state.phase === "finished" || !isWritable();
  const params = [
    sets ? `${row.sets} Gewinn${gameUnitPlural(row.type).toLowerCase()}${sourceMarker(row.sets_source)}` : null,
    scoreLabel(row.score)
      ? `Distanz ${escapeHtml(scoreLabel(row.score))}${sourceMarker(row.score_source)}`
      : (!sets ? `<span style="color:var(--warn);" title="Ausspielziel fehlt — sollte aus Carambus' GamePlan (Sportordnung) kommen.">⚠ Distanz fehlt</span>${sourceMarker(row.score_source)}` : null),
    row.innings ? `${row.innings} Aufn.` : null,
    row.first_break ? `Anstoß ${row.first_break.toUpperCase()}` : null
  ].filter(Boolean).join(" · ");

  return `
    <div class="match-row status-${status}" data-gname="${escapeHtml(gnameOf(row))}">
      <div class="mr-seq">#${row.seqno}</div>
      <div>
        <div class="mr-head">
          <span class="title">${escapeHtml(row.type)}</span>
          <span class="params">${params}</span>
        </div>
        <div class="mr-body">
          <div class="mr-side a">
            <span class="lbl">${escapeHtml(state.team_a.name)}</span>
            ${renderPlayerPicker(row, "a", exp, locked)}
          </div>
          <div class="mr-vs">
            <div>vs</div>
            <div class="res-inputs">
              ${sets
                ? `<input type="number" min="0" data-field="Sets1" value="${ba.Sets1 ?? ""}" placeholder="-" ${locked ? "disabled" : ""}>
                   <span class="sep">:</span>
                   <input type="number" min="0" data-field="Sets2" value="${ba.Sets2 ?? ""}" placeholder="-" ${locked ? "disabled" : ""}>`
                : `<input type="number" min="0" data-field="Ergebnis1" value="${ba.Ergebnis1 ?? ""}" placeholder="-" ${locked ? "disabled" : ""}>
                   <span class="sep">:</span>
                   <input type="number" min="0" data-field="Ergebnis2" value="${ba.Ergebnis2 ?? ""}" placeholder="-" ${locked ? "disabled" : ""}>`}
            </div>
            ${sets ? `<div class="muted" style="font-size:10px;margin-top:2px;">${gameUnitPlural(row.type)}</div>` : (scoreLabel(row.score) ? `<div class="muted" style="font-size:10px;margin-top:2px;">${pointsUnitPlural(row.type)}</div>` : ``)}
          </div>
          <div class="mr-side b">
            <span class="lbl">${escapeHtml(state.team_b.name)}</span>
            ${renderPlayerPicker(row, "b", exp, locked)}
          </div>
        </div>
        ${f141 ? `
        <div class="mr-extra">
          <div class="ex-block">
            <span class="lbl">Aufnahmen / Höchstserie ${escapeHtml(state.team_a.name)}</span>
            <div style="display:flex;gap:4px;">
              <input type="number" min="0" data-field="Aufnahmen1" value="${ba.Aufnahmen1 ?? ""}" placeholder="Aufn." ${locked ? "disabled" : ""}>
              <input type="number" min="0" data-field="Höchstserie1" value="${ba.Höchstserie1 ?? ""}" placeholder="HS" ${locked ? "disabled" : ""}>
            </div>
          </div>
          <div class="ex-block">
            <span class="lbl">Aufnahmen / Höchstserie ${escapeHtml(state.team_b.name)}</span>
            <div style="display:flex;gap:4px;">
              <input type="number" min="0" data-field="Aufnahmen2" value="${ba.Aufnahmen2 ?? ""}" placeholder="Aufn." ${locked ? "disabled" : ""}>
              <input type="number" min="0" data-field="Höchstserie2" value="${ba.Höchstserie2 ?? ""}" placeholder="HS" ${locked ? "disabled" : ""}>
            </div>
          </div>
        </div>` : ``}
        <div class="mr-foot">
          <label style="font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;">
            Tisch:
            <select class="table-pick" data-field="table" ${locked ? "disabled" : ""}>
              <option value="">– wählen –</option>
              ${tables.map(t => `<option value="${escapeHtml(t)}" ${row.table === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}
            </select>
          </label>
          <span class="status-pill ${status}">${status === "done" ? "✓ erfasst" : status === "ready" ? "● bereit" : "○ offen"}</span>
          ${renderSyncPill(g)}
        </div>
      </div>
    </div>`;
}

function renderPlayerPicker(row, side, exp, locked) {
  const roster = assignedRoster(side);
  const cur = exp === 1 ? (row[`player_${side}`] != null ? [row[`player_${side}`]] : []) : (Array.isArray(row[`player_${side}`]) ? row[`player_${side}`] : []);
  let h = "";
  for (let i = 0; i < exp; i++) {
    const sel = cur[i] != null ? String(cur[i]) : "";
    h += `<select class="player-pick" data-side="${side}" data-slot="${i}" ${locked ? "disabled" : ""}>
      <option value="">– Spieler ${exp > 1 ? i + 1 : ""} wählen –</option>
      ${roster.map(p => { const pid = playerId(p); return `<option value="${escapeHtml(pid)}" ${sel === pid ? "selected" : ""}>${escapeHtml(playerName(p))}${p.dbu_nr ? " (DBU " + escapeHtml(String(p.dbu_nr)) + ")" : ""}</option>`; }).join("")}
    </select>`;
  }
  return h;
}

function bindRound(rNo) {
  const games = rowsOfRound(rNo);
  games.forEach(row => {
    const card = document.querySelector(`.match-row[data-gname="${cssEsc(gnameOf(row))}"]`);
    if (!card) return;
    card.querySelectorAll("select.player-pick").forEach(sel => sel.addEventListener("change", e => {
      const side = e.target.dataset.side;
      const slot = parseInt(e.target.dataset.slot, 10);
      const v = e.target.value === "" ? null : e.target.value;   // dbu_nr als String
      const exp = expectedPlayers(row);
      if (exp === 1) {
        row[`player_${side}`] = v;
      } else {
        const arr = Array.isArray(row[`player_${side}`]) ? row[`player_${side}`].slice() : [];
        arr[slot] = v;
        row[`player_${side}`] = arr;
      }
      save(); renderPlay();
    }));
    card.querySelector("select.table-pick")?.addEventListener("change", e => {
      row.table = e.target.value || null;
      save(); renderPlay();
    });
    card.querySelectorAll(".mr-vs input, .mr-extra input").forEach(inp => {
      inp.addEventListener("change", () => commitResult(row, card));
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { commitResult(row, card); e.preventDefault(); } });
    });
  });
}

function commitResult(row, card) {
  if (state.phase === "finished") return;
  const ba = { ...(rowGame(row)?.ba_results || {}) };
  card.querySelectorAll(".mr-vs input, .mr-extra input").forEach(inp => {
    const f = inp.dataset.field;
    const v = inp.value.trim();
    if (v === "") delete ba[f]; else ba[f] = parseInt(v, 10);
  });
  // §4.3 (User-Korrektur 2026-06-28): Spieler1/2 = DBU-Nr team_a/team_b (ba_id ist Relikt).
  // Bei Doppel/4er: erste DBU des Slots als Repräsentant. App schickt dbu_nr als String —
  // Carambus' record_game_result! darf Spieler1/2 als String behandeln.
  const repA = Array.isArray(row.player_a) ? row.player_a[0] : row.player_a;
  const repB = Array.isArray(row.player_b) ? row.player_b[0] : row.player_b;
  if (repA != null) ba.Spieler1 = String(repA);
  if (repB != null) ba.Spieler2 = String(repB);
  // Zeile gilt als gespielt (ended_at), wenn die jeweils maßgeblichen Felder beide gesetzt sind.
  const sets = isSetsDiscipline(row);
  const hasResult = sets
    ? (ba.Sets1 != null && ba.Sets2 != null)
    : (ba.Ergebnis1 != null && ba.Ergebnis2 != null);
  const prev = rowGame(row);
  state.games[gnameOf(row)] = {
    ba_results: ba,
    ended_at: hasResult ? (prev?.ended_at || Date.now()) : null,
    sync: prev?.sync || null    // bestehender Sync-Stand bleibt; pushGameResult überschreibt ihn
  };
  save(); renderAll();
  // Live-Push asynchron (kein await — UI bleibt responsiv, Status erscheint als Sync-Pille).
  if (hasResult && isLive() && state.carambusParty?.external_id) {
    pushGameResult(row);
  }
}

// Sync-Pille je Spielzeile (Direkteingabe-Push §2). Sichtbar nur, wenn ein Sync-Versuch
// gelaufen ist; "synced" hat title=Server-intermediate_result fürs Debugging.
function renderSyncPill(g) {
  const s = g?.sync;
  if (!s) return "";
  if (s.status === "pending") return `<span class="sync-pill pending" title="Sende …">⟳ sync</span>`;
  if (s.status === "synced") {
    const tip = s.server_intermediate ? `Server: ${s.server_intermediate.game_points || ""} / ${s.server_intermediate.match_points || ""}` : "an Carambus übertragen";
    return `<span class="sync-pill synced" title="${escapeHtml(tip)}">✓ sync</span>`;
  }
  return `<span class="sync-pill error" title="${escapeHtml(s.error || "Fehler")}">⚠ sync</span>`;
}

function cssEsc(s) { return String(s).replace(/(["\\#.()\[\]:])/g, "\\$1"); }

function collectDuplicates(rNo) {
  const games = rowsOfRound(rNo);
  const out = [];
  ["a", "b"].forEach(side => {
    const seen = new Map(); // baId → seqno[]
    games.forEach(row => {
      const ids = expectedPlayers(row) === 1 ? (row[`player_${side}`] != null ? [row[`player_${side}`]] : []) : (Array.isArray(row[`player_${side}`]) ? row[`player_${side}`].filter(x => x != null) : []);
      ids.forEach(id => {
        const arr = seen.get(id) || []; arr.push(row.seqno); seen.set(id, arr);
      });
    });
    seen.forEach((seqs, id) => {
      if (seqs.length > 1) {
        const p = rosterById(side, id);
        out.push(`${side === "a" ? state.team_a.name : state.team_b.name}: ${playerName(p)} in Spielen ${seqs.join(", ")}`);
      }
    });
  });
  const tSeen = new Map();
  games.forEach(row => { if (row.table) { const a = tSeen.get(row.table) || []; a.push(row.seqno); tSeen.set(row.table, a); } });
  tSeen.forEach((seqs, t) => { if (seqs.length > 1) out.push(`Tisch „${t}" doppelt belegt (Spiele ${seqs.join(", ")})`); });
  return out;
}

// ===== Aggregation §4.4 — game_points / match_points =====
function computeIntermediate() {
  const pm = state.party_monitor;
  if (!pm) return { gameA: 0, gameB: 0, mpA: 0, mpB: 0, playedCount: 0, winnerName: null };
  let gA = 0, gB = 0, played = 0;
  (pm.rows || []).filter(isGameRow).forEach(row => {
    const g = rowGame(row);
    if (!g || !g.ended_at) return;
    const ba = g.ba_results || {};
    const a = isSetsDiscipline(row) ? (ba.Sets1 ?? 0) : (ba.Ergebnis1 ?? 0);
    const b = isSetsDiscipline(row) ? (ba.Sets2 ?? 0) : (ba.Ergebnis2 ?? 0);
    const gp = row.game_points || { win: 1, draw: 0, lost: 0 };
    if (a > b) { gA += gp.win; gB += gp.lost; }
    else if (b > a) { gA += gp.lost; gB += gp.win; }
    else { gA += gp.draw; gB += gp.draw; }
    played++;
  });
  const mp = pm.match_points || { win: 2, draw: 1, lost: 0 };
  let mpA, mpB, winnerName = null;
  if (gA > gB) { mpA = mp.win; mpB = mp.lost; winnerName = state.team_a?.name || null; }
  else if (gB > gA) { mpA = mp.lost; mpB = mp.win; winnerName = state.team_b?.name || null; }
  else { mpA = mp.draw; mpB = mp.draw; }
  return { gameA: gA, gameB: gB, mpA, mpB, playedCount: played, winnerName };
}

// ===== TABELLE-Tab =====
function renderStandings() {
  const el = document.getElementById("tab-standings");
  if (!state.party) { el.innerHTML = `<div class="card"><p class="muted">Noch kein Spieltag.</p></div>`; return; }
  const pm = state.party_monitor;
  const all = (pm.rows || []).filter(isGameRow);
  const inter = computeIntermediate();
  const final = state.phase === "finished";

  el.innerHTML = `
    <div class="card">
      <h2>Mannschaftsergebnis</h2>
      <div class="standings-result">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">${escapeHtml(state.team_a.name)} <span class="muted">vs</span> ${escapeHtml(state.team_b.name)}</div>
        <div class="gp">${inter.playedCount ? `${inter.gameA}:${inter.gameB}` : "–:–"}</div>
        <div class="mp">${inter.playedCount ? `Mannschaftspunkte ${inter.mpA}:${inter.mpB}` : "noch keine Spiele erfasst"}</div>
        ${final && inter.winnerName ? `<div class="winner">🏆 Sieger: ${escapeHtml(inter.winnerName)}</div>` : ``}
        ${final && !inter.winnerName && inter.playedCount ? `<div class="winner">🤝 Unentschieden</div>` : ``}
        <div class="muted" style="font-size:11px;margin-top:8px;">${inter.playedCount}/${all.length} Spiele${final ? " · Spielbericht abgeschlossen" : " (live)"}</div>
      </div>
      <h3 style="margin-top:18px;">Einzelergebnisse</h3>
      <table>
        <thead><tr><th>#</th><th>Disziplin</th><th>${escapeHtml(state.team_a.name)}</th><th>Ergebnis</th><th>${escapeHtml(state.team_b.name)}</th><th>Tisch</th><th>Pkt A:B</th></tr></thead>
        <tbody>${all.map(row => renderResultRow(row)).join("")}</tbody>
      </table>
    </div>`;
}

function renderResultRow(row) {
  const g = rowGame(row);
  const ba = g?.ba_results || {};
  const sets = isSetsDiscipline(row);
  const exp = expectedPlayers(row);
  const namesOf = side => {
    const v = row[`player_${side}`];
    const ids = exp === 1 ? (v != null ? [v] : []) : (Array.isArray(v) ? v.filter(x => x != null) : []);
    return ids.map(id => playerName(rosterById(side, id))).join(", ") || `<span class="muted">–</span>`;
  };
  let resultCell = `<span class="muted">–</span>`;
  let pts = `<span class="muted">–</span>`;
  if (g?.ended_at) {
    const a = sets ? (ba.Sets1 ?? 0) : (ba.Ergebnis1 ?? 0);
    const b = sets ? (ba.Sets2 ?? 0) : (ba.Ergebnis2 ?? 0);
    resultCell = `<strong>${a}:${b}</strong>${sets ? ` <span class='muted' style='font-size:11px;'>(${gameUnitPlural(row.type)})</span>` : ""}`;
    const gp = row.game_points || { win: 1, draw: 0, lost: 0 };
    const [pa, pb] = a > b ? [gp.win, gp.lost] : b > a ? [gp.lost, gp.win] : [gp.draw, gp.draw];
    pts = `${pa}:${pb}`;
  }
  return `<tr>
    <td><span class="gold" style="font-family:monospace;">#${row.seqno}</span></td>
    <td>${escapeHtml(row.type)}</td>
    <td>${namesOf("a")}</td>
    <td style="text-align:center;">${resultCell}</td>
    <td>${namesOf("b")}</td>
    <td>${row.table ? escapeHtml(row.table) : `<span class="muted">–</span>`}</td>
    <td style="text-align:center;font-family:monospace;">${pts}</td>
  </tr>`;
}

// ===== Helfer =====
function playerName(p) { return p ? `${p.firstname || ""} ${p.lastname || ""}`.trim() || (p.dbu_nr ? `DBU ${p.dbu_nr}` : "?") : "?"; }
function switchTab(tab) { const btn = document.querySelector(`nav.tabs button[data-tab="${tab}"]`); if (btn) btn.click(); }

renderAll();
</script>
