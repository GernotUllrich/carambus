# Regionsdumps der Authority (Plan 18-02) — docs/administrators/region-dumps
#
# Einbinden im 443-server-Block von /etc/nginx/sites-available/carambus_api:
#   include snippets/carambus_region_dumps.conf;
# Voraussetzung: /etc/nginx/conf.d/carambus_bot_block.conf nimmt /region_dumps/ aus (Client ist curl).
#
# Dateien:  /var/www/carambus_api/shared/region_dumps/<REGION>/{latest.sql.gz,latest.json,carambus_<region>_<ts>.sql.gz}
# Zugang:   /var/www/carambus_api/shared/region_dumps/.htpasswd/<REGION>  (rake region_dump:grant/revoke)
#
# Benannte Captures statt $1/$2: nummerierte Captures koennen von spaeteren Regex-Auswertungen
# (Maps des Bot-Blocks) ueberschrieben werden, bevor auth_basic_user_file sie liest.
# Die Regex steht in Anfuehrungszeichen: nginx liest {8} sonst als Blockbeginn.
location ~ "^/region_dumps/(?<rd_region>[A-Z]+)/(?<rd_file>latest\.sql\.gz|latest\.json|carambus_[a-z]+_[0-9]{8}_[0-9]{6}\.sql\.gz)$" {
    alias /var/www/carambus_api/shared/region_dumps/$rd_region/$rd_file;
    auth_basic "Carambus Regionsdump";
    auth_basic_user_file /var/www/carambus_api/shared/region_dumps/.htpasswd/$rd_region;
    default_type application/octet-stream;
    types { application/json json; }
    add_header Cache-Control "no-store" always;
}

# Alles andere unter /region_dumps/ (Verzeichnisse, Logs, Zugangsdateien): nicht vorhanden.
# Bewusst ohne ^~ — sonst wuerde nginx die Regex-Location oben nie pruefen.
location /region_dumps/ {
    return 404;
}
