# Carambus Bot-Blockliste — UA-basierte Abweisung am Edge.
# 2026-04-27. Ergänzt das Disallow:/ in /robots.txt für Bad-Actor-Bots,
# die robots.txt ignorieren.
#
# Source: carambus_master/templates/nginx/carambus_bot_block.conf
# Install:
#   sudo cp <source> /etc/nginx/conf.d/carambus_bot_block.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verwendung in Scenario-nginx-Configs:
#   if ($carambus_deny) { return 403 "Forbidden\n"; }
#
# WICHTIG: $carambus_deny auswerten, nicht $carambus_block_bot — sonst greift
# der Filter auch auf /versions/*, dem Sync-Endpunkt der Regional-/Location-
# Server. Ein 403 dort legt den Datenabgleich still (der Client sah bis
# 2026-08 nur "JSON::ParserError: unexpected end of input").
#
# Deaktivieren pro Scenario: bot_block_enabled: false in config.yml setzen
# (z. B. carambus.de, das gescraped werden darf).

map $http_user_agent $carambus_block_bot {
    default                                                       0;

    # Generische Crawler-Patterns (case-insensitive)
    "~*(bot|crawler|spider|scraper|wget|curl/|python-requests)"   1;

    # Bekannte SEO/Marketing-Crawler (ignorieren oft robots.txt)
    "~*(AhrefsBot|SemrushBot|DotBot|MJ12Bot|PetalBot|YandexBot|Bytespider)" 1;

    # AI/LLM-Trainings-Crawler (eigenes Disallow per UA)
    "~*(GPTBot|ClaudeBot|ChatGPT-User|CCBot|anthropic-ai|Claude-Web|cohere-ai|Diffbot|FacebookBot|Google-Extended|PerplexityBot)" 1;

    # Leerer User-Agent (typisch für Skript-Spam)
    ""                                                            1;
}

# --- Ausnahme fuer den Maschine-zu-Maschine-Sync ------------------------------
# /versions/* wird von jedem Regional- und Location-Server stuendlich abgefragt
# (Version.update_from_carambus_api). Dieser Verkehr darf NIE am UA-Filter
# haengen bleiben: er ist per Definition ein Skript, und ein 403 ist dort nicht
# von "keine Updates" zu unterscheiden — der Sync auf bc-wedel stand deshalb
# monatelang unbemerkt still.
#
# nginx kennt in `if` kein UND, deshalb der uebliche Weg ueber eine zweite Map
# und eine zusammengesetzte Auswertung.
map $request_uri $carambus_sync_path {
    default        0;
    "~^/versions/" 1;
}

# "<geblockt>:<Sync-Pfad>" — nur 1:0 wird abgewiesen.
map "$carambus_block_bot:$carambus_sync_path" $carambus_deny {
    default 0;
    "1:0"   1;
}
